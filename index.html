<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidetalkk — Live Chat</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-chat: #0f172a;
      --bg-card: #334155;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-sent: #4f46e5;
      --msg-received: #334155;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Main Container */
    .app-container {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      background-color: var(--bg-sidebar);
      border-radius: 16px;
      display: flex;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: #111827;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background-color: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .user-profile {
      background-color: var(--bg-card);
      padding: 0.75rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .user-profile label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      display: block;
      margin-bottom: 0.25rem;
    }

    .user-profile input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
    }

    .room-list-header {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .room-item {
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      margin-bottom: 0.25rem;
    }

    .room-item:hover, .room-item.active {
      background-color: var(--bg-card);
      color: var(--text-main);
      font-weight: 600;
    }

    /* Main Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-chat);
    }

    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-info h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .chat-header-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background-color: #ef4444;
      color: white;
      border-color: #ef4444;
    }

    /* Messages List */
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 65%;
    }

    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      display: flex;
      gap: 0.5rem;
    }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.sent .message-bubble {
      background-color: var(--msg-sent);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.received .message-bubble {
      background-color: var(--msg-received);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    /* Input Box */
    .input-container {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background-color: var(--bg-sidebar);
    }

    .message-input {
      flex: 1;
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 0.8rem 1rem;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .message-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background-color: var(--accent-hover);
    }

    @media (max-width: 768px) {
      .app-container {
        height: 100vh;
        border-radius: 0;
      }
      .sidebar {
        width: 80px;
        padding: 0.5rem;
      }
      .brand-name, .user-profile label, .room-list-header {
        display: none;
      }
      .message {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">S</div>
        <div class="brand-name">Sidetalkk</div>
      </div>

      <div class="user-profile">
        <label for="usernameInput">Your Handle</label>
        <input type="text" id="usernameInput" value="User_1" maxlength="15" />
      </div>

      <div class="room-list-header">Channels</div>
      <div class="room-item active" data-room="general"># general</div>
      <div class="room-item" data-room="dev"># developers</div>
      <div class="room-item" data-room="random"># random</div>
    </aside>

    <!-- Main Chat Window -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-header-info">
          <h2 id="currentRoomTitle"># general</h2>
          <p id="onlineStatus">Status: Connected</p>
        </div>
        <button id="clearChatBtn" class="clear-btn">Clear Local View</button>
      </header>

      <div id="messagesContainer" class="messages-container">
        <!-- Messages render dynamically here -->
      </div>

      <footer class="input-container">
        <input type="text" id="messageInput" class="message-input" placeholder="Type a message into #general..." autocomplete="off" />
        <button id="sendBtn" class="send-btn">Send</button>
      </footer>
    </main>
  </div>

  <script>
    // System State
    const state = {
      username: localStorage.getItem('sidetalkk_user') || 'Guest_' + Math.floor(Math.random() * 1000),
      currentRoom: 'general',
      messages: JSON.parse(localStorage.getItem('sidetalkk_msgs')) || []
    };

    // DOM Elements
    const elements = {
      usernameInput: document.getElementById('usernameInput'),
      messagesContainer: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      clearChatBtn: document.getElementById('clearChatBtn'),
      currentRoomTitle: document.getElementById('currentRoomTitle'),
      roomItems: document.querySelectorAll('.room-item')
    };

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
      elements.usernameInput.value = state.username;
      setupEventListeners();
      renderMessages();
    });

    // Binding Event Listeners safely
    function setupEventListeners() {
      // Send Message Button
      elements.sendBtn.addEventListener('click', handleSendMessage);

      // Enter Key Support
      elements.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      // Update Username
      elements.usernameInput.addEventListener('change', (e) => {
        const val = e.target.value.trim();
        if (val) {
          state.username = val;
          localStorage.setItem('sidetalkk_user', val);
        }
      });

      // Channel Switching
      elements.roomItems.forEach(item => {
        item.addEventListener('click', () => {
          elements.roomItems.forEach(r => r.classList.remove('active'));
          item.classList.add('active');
          state.currentRoom = item.dataset.room;
          elements.currentRoomTitle.textContent = `# ${state.currentRoom}`;
          elements.messageInput.placeholder = `Type a message into #${state.currentRoom}...`;
          renderMessages();
        });
      });

      // Clear Chat View
      elements.clearChatBtn.addEventListener('click', () => {
        if (confirm("Clear local messages in this room?")) {
          state.messages = state.messages.filter(m => m.room !== state.currentRoom);
          saveAndRender();
        }
      });
    }

    // Message Logic
    function handleSendMessage() {
      const content = elements.messageInput.value.trim();
      if (!content) return;

      const newMessage = {
        id: Date.now(),
        sender: state.username,
        text: content,
        room: state.currentRoom,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      state.messages.push(newMessage);
      elements.messageInput.value = '';
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('sidetalkk_msgs', JSON.stringify(state.messages));
      renderMessages();
    }

    function renderMessages() {
      elements.messagesContainer.innerHTML = '';
      const currentRoomMsgs = state.messages.filter(m => m.room === state.currentRoom);

      if (currentRoomMsgs.length === 0) {
        elements.messagesContainer.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); margin-top: auto; margin-bottom: auto;">
            <p>No messages in #${state.currentRoom} yet.</p>
            <p style="font-size: 0.8rem; margin-top: 0.25rem;">Start the conversation!</p>
          </div>
        `;
        return;
      }

      currentRoomMsgs.forEach(msg => {
        const isSentByMe = msg.sender === state.username;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSentByMe ? 'sent' : 'received'}`;

        msgDiv.innerHTML = `
          <div class="message-meta">
            <span>${msg.sender}</span>
            <span>•</span>
            <span>${msg.timestamp}</span>
          </div>
          <div class="message-bubble">${escapeHTML(msg.text)}</div>
        `;

        elements.messagesContainer.appendChild(msgDiv);
      });

      // Auto-scroll to bottom
      elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    // Security Helper: Prevent HTML Injection
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
