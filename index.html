<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideTalk - Realtime Chat Platform</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --bg-card: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --primary-color: #3b82f6;
      --sent-bg: #3b82f6;
      --sent-text: #ffffff;
      --received-bg: #e2e8f0;
      --received-text: #1e293b;
      --hover-bg: #f1f5f9;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --bg-card: #1e293b;
      --text-color: #f1f5f9;
      --border-color: #334155;
      --primary-color: #3b82f6;
      --sent-bg: #3b82f6;
      --sent-text: #ffffff;
      --received-bg: #334155;
      --received-text: #f1f5f9;
      --hover-bg: #273548;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Authentication Screen Styling */
    .auth-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .auth-box {
      background: var(--bg-card);
      padding: 40px 30px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
      width: 360px;
      text-align: center;
    }

    .auth-box h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .auth-box p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .auth-box input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-box input:focus {
      border-color: var(--primary-color);
    }

    .auth-box button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--primary-color);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .auth-box button:hover {
      opacity: 0.9;
    }

    /* Main Chat App Interface */
    .chat-app {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    @media (min-width: 901px) {
      .chat-app {
        height: 92vh;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      }
    }

    /* Chat Header */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-weight: 600;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--border-color);
    }

    /* Messages Container Area */
    .messages-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Message Item Structure */
    .message {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }

    .message.sent {
      flex-direction: row-reverse;
    }

    .msg-avatar-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid var(--border-color);
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .msg-avatar-icon:hover {
      transform: scale(1.05);
    }

    .message-content-wrapper {
      max-width: 75%;
    }

    .message-info {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message.sent .message-info {
      flex-direction: row-reverse;
    }

    .msg-username-trigger {
      cursor: pointer;
      font-weight: 600;
    }

    .msg-username-trigger:hover {
      text-decoration: underline;
    }

    .message-actions-triggers {
      display: none;
      gap: 6px;
      margin-left: 6px;
    }

    .message.sent .message-actions-triggers {
      margin-left: 0;
      margin-right: 6px;
    }

    .message:hover .message-actions-triggers {
      display: inline-flex;
    }

    .action-btn-trigger {
      background: none;
      border: none;
      font-size: 11px;
      cursor: pointer;
      color: var(--primary-color);
      padding: 0 4px;
      font-weight: 500;
    }

    .action-btn-trigger:hover {
      text-decoration: underline;
    }

    /* Message Bubble */
    .message-bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      position: relative;
      word-break: break-word;
      line-height: 1.5;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .message.sent .message-bubble {
      background: var(--sent-bg);
      color: var(--sent-text);
      border-top-right-radius: 3px;
    }

    .message.received .message-bubble {
      background: var(--received-bg);
      color: var(--received-text);
      border-top-left-radius: 3px;
    }

    .quoted-reply {
      font-size: 13px;
      background: rgba(0, 0, 0, 0.1);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 3px solid var(--primary-color);
    }

    .edited-tag {
      font-size: 11px;
      opacity: 0.75;
      margin-left: 6px;
      font-style: italic;
    }

    .gif-img {
      max-width: 240px;
      border-radius: 10px;
      display: block;
    }

    /* Reaction Pills */
    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .message.sent .message-reactions {
      justify-content: flex-end;
    }

    .reaction-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--border-color);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reaction-pill:hover {
      background: var(--hover-bg);
    }

    .reaction-pill.user-reacted {
      border: 1px solid var(--primary-color);
      background: rgba(59, 130, 246, 0.12);
    }

    /* Popups for Reactions & Options */
    .reaction-popup, .options-popup {
      display: none;
      position: absolute;
      bottom: 105%;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      border-radius: 10px;
      padding: 6px;
      z-index: 100;
      gap: 4px;
      white-space: nowrap;
    }

    .message.sent .reaction-popup, .message.sent .options-popup {
      right: auto;
      left: 0;
    }

    .reaction-popup button, .options-popup button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-color);
      text-align: left;
      transition: background 0.15s;
    }

    .reaction-popup button:hover, .options-popup button:hover {
      background: var(--border-color);
    }

    .options-popup button.danger {
      color: #ef4444;
    }

    /* Preview Bar for Reply/Edit */
    .preview-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--border-color);
      font-size: 13px;
    }

    /* Chat Input Area */
    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      position: relative;
    }

    .quick-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--border-color);
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-color);
      transition: background 0.2s;
    }

    .tool-btn:hover {
      background: var(--hover-bg);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: var(--primary-color);
    }

    .input-row button.send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-row button.send-btn:hover {
      opacity: 0.9;
    }

    /* Modals (Emoji Picker, GIFs, Profile Card) */
    .emoji-picker-modal, .gif-modal {
      display: none;
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      border-radius: 14px;
      padding: 14px;
      width: 300px;
      z-index: 100;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      font-size: 20px;
      text-align: center;
    }

    .emoji-picker-item {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .emoji-picker-item:hover {
      background: var(--border-color);
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .gif-grid img {
      width: 100%;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .gif-grid img:hover {
      transform: scale(1.03);
    }

    .gif-link-row {
      display: flex;
      gap: 6px;
    }

    .gif-link-row input {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-color);
      outline: none;
    }

    .gif-link-row button {
      padding: 8px 12px;
      font-size: 13px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .profile-card-modal {
      position: absolute;
      z-index: 1000;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      border-radius: 14px;
      padding: 18px;
      width: 260px;
      font-family: inherit;
    }

    .profile-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .profile-card-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-color);
    }

    .profile-card-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .profile-card-status {
      font-size: 12px;
      color: #10b981;
      margin-top: 2px;
      display: block;
    }

    .profile-card-bio {
      font-size: 13px;
      color: var(--text-color);
    }

    .profile-card-bio p {
      margin: 6px 0 0 0;
      word-break: break-word;
      line-height: 1.4;
      color: #64748b;
    }
  </style>
</head>
<body>

      chatApp: document.getElementById('chatApp'),
      loginUsernameInput: document.getElementById('loginUsernameInput'),
      loginBtn: document.getElementById('loginBtn'),
      displayUserTag: document.getElementById('displayUserTag'),
      onlineBadge: document.getElementById('onlineBadge'),
      messagesContainer: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      gifToggleBtn: document.getElementById('gifToggleBtn'),
      gifModal: document.getElementById('gifModal'),
      gifGrid: document.getElementById('gifGrid'),
      gifLinkInput: document.getElementById('gifLinkInput'),
      sendGifLinkBtn: document.getElementById('sendGifLinkBtn'),
      themeToggleBtn: document.getElementById('themeToggleBtn'),
      previewBar: document.getElementById('previewBar'),
      previewText: document.getElementById('previewText'),
      cancelPreviewBtn: document.getElementById('cancelPreviewBtn'),
      emojiPickerToggleBtn: document.getElementById('emojiPickerToggleBtn'),
      emojiPickerModal: document.getElementById('emojiPickerModal')
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.body.setAttribute('data-theme', state.theme);
      elements.themeToggleBtn.textContent = state.theme === 'dark' ? '☀️' : '🌙';

      if (state.user) {
        startChatSession(state.user, state.bio, state.avatar);
      }

      setupListeners();
      loadGIFs();
      listenForOnlineUsers();
    });

    function setupListeners() {
      elements.loginBtn.addEventListener('click', () => handleLogin());
      elements.loginUsernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      elements.themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('sidetalk_theme', newTheme);
        elements.themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
      });

      elements.sendBtn.addEventListener('click', () => handleMainAction());
      elements.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleMainAction();
        }
      });

      document.querySelectorAll('.quick-toolbar .tool-btn[data-emoji]').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.dataset.emoji;
          elements.messageInput.focus();
        });
      });

      elements.emojiPickerToggleBtn.addEventListener('click', () => {
        const isVisible = elements.emojiPickerModal.style.display === 'block';
        elements.emojiPickerModal.style.display = isVisible ? 'none' : 'block';
        elements.gifModal.style.display = 'none';
      });

      document.querySelectorAll('.emoji-picker-item').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.textContent;
          elements.messageInput.focus();
          elements.emojiPickerModal.style.display = 'none';
        });
      });

      elements.gifToggleBtn.addEventListener('click', () => {
        const isVisible = elements.gifModal.style.display === 'block';
        elements.gifModal.style.display = isVisible ? 'none' : 'block';
        elements.emojiPickerModal.style.display = 'none';
      });

      elements.sendGifLinkBtn.addEventListener('click', () => {
        const url = elements.gifLinkInput.value.trim();
        if (url) {
          sendGIFMessage(url);
          elements.gifLinkInput.value = '';
          elements.gifModal.style.display = 'none';
        }
      });

      elements.cancelPreviewBtn.addEventListener('click', () => {
        clearActiveState();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.emoji-picker-modal') && !e.target.closest('#emojiPickerToggleBtn') &&
            !e.target.closest('.gif-modal') && !e.target.closest('#gifToggleBtn') && 
            !e.target.closest('.reaction-popup') && !e.target.closest('.options-popup') &&
            !e.target.closest('.action-btn-trigger') && !e.target.closest('.profile-card-modal')) {
          elements.emojiPickerModal.style.display = 'none';
          elements.gifModal.style.display = 'none';
          document.querySelectorAll('.reaction-popup').forEach(p => p.style.display = 'none');
          document.querySelectorAll('.options-popup').forEach(p => p.style.display = 'none');
          document.querySelectorAll('.profile-card-modal').forEach(p => p.remove());
        }
      });
    }

    async function handleLogin() {
      const name = elements.loginUsernameInput.value.trim();
      const userBio = "Exploring SideTalk community room!";
      const userAvatar = DEFAULT_AVATAR;

      if (!name) {
        alert("Please enter a valid nickname!");
        return;
      }

      if (containsProfanity(name)) {
        alert("Your nickname contains restricted words or profanity.");
        return;
      }

      try {
        const userRef = ref(db, 'users/' + name);
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
          alert("This username is already taken by someone online! Please choose a different nickname.");
          return;
        }
      } catch (err) {
        console.error(err);
      }

      state.user = name;
      state.bio = userBio;
      state.avatar = userAvatar;
      
      localStorage.setItem('sidetalk_user', name);
      localStorage.setItem('sidetalk_bio', userBio);
      localStorage.setItem('sidetalk_avatar', userAvatar);

      startChatSession(name, userBio, userAvatar);
    }

    async function startChatSession(username, bio, avatar) {
      elements.authScreen.style.display = 'none';
      elements.chatApp.style.display = 'flex';
      elements.displayUserTag.textContent = username;

      try {
        const userRef = ref(db, 'users/' + username);
        await set(userRef, { 
          online: true, 
          lastLogin: Date.now(),
          bio: bio,
          avatar: avatar
        });
        onDisconnect(userRef).remove();
      } catch (err) {
        console.error(err);
      }

      listenForFirebaseMessages();
    }

    function listenForOnlineUsers() {
      onValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        const count = data ? Object.keys(data).length : 0;
        elements.onlineBadge.textContent = `🟢 ${count} Online`;
      });
    }

    function loadGIFs() {
      elements.gifGrid.innerHTML = '';
      presetGIFs.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.addEventListener('click', () => {
          sendGIFMessage(url);
          elements.gifModal.style.display = 'none';
        });
        elements.gifGrid.appendChild(img);
      });
    }

    function setReplyState(sender, text) {
      state.editingMsgId = null;
      state.replyingTo = { sender, text };
      elements.previewText.textContent = `Replying to ${sender}: ${text}`;
      elements.previewBar.style.display = 'flex';
      elements.messageInput.focus();
    }

    function setEditState(msgId, currentText) {
      state.replyingTo = null;
      state.editingMsgId = msgId;
      elements.messageInput.value = currentText;
      elements.previewText.textContent = `Editing message: ${currentText}`;
      elements.previewBar.style.display = 'flex';
      elements.messageInput.focus();
    }

    function clearActiveState() {
      state.replyingTo = null;
      state.editingMsgId = null;
      elements.messageInput.value = '';
      elements.previewBar.style.display = 'none';
    }

    function handleMainAction() {
      const text = elements.messageInput.value.trim();
      if (!text) return;

      if (containsProfanity(text)) {
        alert("Your message contains inappropriate language or slurs and cannot be sent.");
        return;
      }

      if (state.editingMsgId) {
        const msgRef = ref(db, `messages/${state.editingMsgId}`);
        update(msgRef, { text: text, edited: true }).then(() => {
          clearActiveState();
        }).catch(err => {
          alert("Failed to edit message: " + err.message);
        });
      } else {
        const payload = { text: text, type: 'text' };
        if (state.replyingTo) {
          payload.replyTo = state.replyingTo;
        }
        pushMessageToFirebase(payload);
        elements.messageInput.value = '';
        clearActiveState();
      }
    }

    function sendGIFMessage(url) {
      if (containsProfanity(url)) {
        alert("Invalid URL link.");
        return;
      }
      const payload = { url: url, type: 'gif' };
      if (state.replyingTo) {
        payload.replyTo = state.replyingTo;
      }

      pushMessageToFirebase(payload);
      clearActiveState();
    }

    function pushMessageToFirebase(payload) {
      const msg = {
        sender: state.user,
        avatar: state.avatar,
        bio: state.bio,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now(),
        ...payload
      };

      push(messagesRef, msg).catch((error) => {
        alert("Failed to send message! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function deleteForEveryone(msgId) {
      if (confirm("Delete this message for everyone?")) {
        remove(ref(db, `messages/${msgId}`)).catch(err => {
          alert("Failed to delete message: " + err.message);
        });
      }
    }

    function deleteForMe(msgId) {
      state.deletedForMe.push(msgId);
      localStorage.setItem('sidetalk_deleted_for_me', JSON.stringify(state.deletedForMe));
      renderMessages();
    }

    function toggleReaction(msgId, emoji) {
      const reactionsRef = ref(db, `messages/${msgId}/reactions`);
      get(reactionsRef).then((snapshot) => {
        let reactions = snapshot.exists() ? snapshot.val() : {};
        if (!reactions[emoji]) {
          reactions[emoji] = {};
        }

        if (reactions[emoji][state.user]) {
          delete reactions[emoji][state.user];
          if (Object.keys(reactions[emoji]).length === 0) {
            delete reactions[emoji];
          }
        } else {
          reactions[emoji][state.user] = true;
        }

        set(reactionsRef, reactions);
      });
    }

    function listenForFirebaseMessages() {
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        state.messages = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            state.messages.push({ id: key, ...data[key] });
          });

          state.messages.sort((a, b) => a.createdAt - b.createdAt);
        }
        
        renderMessages();
      }, (error) => {
        alert("Failed to load messages! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function showProfileCard(username, avatarUrl, bioText, targetElement) {
      document.querySelectorAll('.profile-card-modal').forEach(p => p.remove());

      const card = document.createElement('div');
      card.className = 'profile-card-modal';
      card.innerHTML = `
        <div class="profile-card-header">
          <img src="${avatarUrl || DEFAULT_AVATAR}" alt="Avatar" class="profile-card-avatar" />
          <div>
            <h3>@${escapeHTML(username)}</h3>
            <span class="profile-card-status">🟢 Online</span>
          </div>
        </div>
        <div class="profile-card-bio">
          <strong>Bio:</strong>
          <p>${escapeHTML(bioText || "No bio set.")}</p>
        </div>
      `;

      document.body.appendChild(card);
      const rect = targetElement.getBoundingClientRect();
      card.style.top = `${window.scrollY + rect.bottom + 8}px`;
      card.style.left = `${window.scrollX + rect.left}px`;
    }

    function renderMessages() {
      elements.messagesContainer.innerHTML = '';

      state.messages.forEach(msg => {
        if (state.deletedForMe.includes(msg.id)) return;

        const isMe = msg.sender === state.user;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;

        const userAvatar = msg.avatar || DEFAULT_AVATAR;
        const userBio = msg.bio || "Exploring SideTalk community room!";

        let replyHTML = '';
        if (msg.replyTo) {
          replyHTML = `
            <div class="quoted-reply">
              <strong>@${escapeHTML(msg.replyTo.sender)}</strong>: ${escapeHTML(msg.replyTo.text)}
            </div>
          `;
        }

        let contentHTML = '';
        if (msg.type === 'gif') {
          contentHTML = `<img src="${msg.url}" class="gif-img" alt="GIF/Image" />`;
        } else {
          const editedLabel = msg.edited ? `<span class="edited-tag">(edited)</span>` : '';
          contentHTML = `${escapeHTML(msg.text)}${editedLabel}`;
        }

        let reactionsHTML = '';
        if (msg.reactions) {
          reactionsHTML = '<div class="message-reactions">';
          Object.keys(msg.reactions).forEach(emoji => {
            const usersObj = msg.reactions[emoji];
            const count = Object.keys(usersObj).length;
            const userReacted = usersObj[state.user] ? 'user-reacted' : '';
            reactionsHTML += `
              <div class="reaction-pill ${userReacted}" data-emoji="${emoji}">
                <span>${emoji}</span> <span>${count}</span>
              </div>
            `;
          });
          reactionsHTML += '</div>';
        }

        let optionsButtonsHTML = `<button class="delete-me-btn">Delete for me</button>`;
        if (isMe && msg.type === 'text') {
          optionsButtonsHTML = `
            <button class="edit-msg-btn">Edit</button>
            <button class="delete-everyone-btn danger">Delete for everyone</button>
            <button class="delete-me-btn">Delete for me</button>
          `;
        } else if (isMe && msg.type === 'gif') {
          optionsButtonsHTML = `
            <button class="delete-everyone-btn danger">Delete for everyone</button>
            <button class="delete-me-btn">Delete for me</button>
          `;
        }

        msgDiv.innerHTML = `
          <img src="${userAvatar}" class="msg-avatar-icon" alt="Avatar" title="View Profile" />
          <div class="message-content-wrapper">
            <div class="message-info">
              <span class="msg-username-trigger" title="View Profile">${escapeHTML(msg.sender)}</span> • <span>${msg.timestamp}</span>
              <div class="message-actions-triggers">
                <button class="action-btn-trigger react-trigger">React</button>
                <button class="action-btn-trigger reply-btn-trigger">Reply</button>
                <button class="action-btn-trigger options-trigger">⋮</button>
              </div>
            </div>
            <div class="message-bubble" title="Double-click to copy message text">
              ${replyHTML}${contentHTML}
              <div class="reaction-popup">
                <button data-emoji="👍">👍</button>
                <button data-emoji="❤️">❤️</button>
                <button data-emoji="😂">😂</button>
                <button data-emoji="🔥">🔥</button>
                <button data-emoji="💀">💀</button>
              </div>
              <div class="options-popup">
                ${optionsButtonsHTML}
              </div>
            </div>
            ${reactionsHTML}
          </div>
        `;

        const avatarEl = msgDiv.querySelector('.msg-avatar-icon');
        const usernameEl = msgDiv.querySelector('.msg-username-trigger');
        [avatarEl, usernameEl].forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            showProfileCard(msg.sender, userAvatar, userBio, el);
          });
        });

        const replyBtn = msgDiv.querySelector('.reply-btn-trigger');
        replyBtn.addEventListener('click', () => {
          const snippet = msg.type === 'gif' ? '[GIF/Image]' : msg.text;
          setReplyState(msg.sender, snippet);
        });

        const reactTrigger = msgDiv.querySelector('.react-trigger');
        const reactionPopup = msgDiv.querySelector('.reaction-popup');
        reactTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.reaction-popup').forEach(p => { if (p !== reactionPopup) p.style.display = 'none'; });
          document.querySelectorAll('.options-popup').forEach(p => p.style.display = 'none');
          reactionPopup.style.display = reactionPopup.style.display === 'flex' ? 'none' : 'flex';
        });

        const optionsTrigger = msgDiv.querySelector('.options-trigger');
        const optionsPopup = msgDiv.querySelector('.options-popup');
        optionsTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.options-popup').forEach(p => { if (p !== optionsPopup) p.style.display = 'none'; });
          document.querySelectorAll('.reaction-popup').forEach(p => p.style.display = 'none');
          optionsPopup.style.display = optionsPopup.style.display === 'flex' ? 'none' : 'flex';
        });

        const editBtn = msgDiv.querySelector('.edit-msg-btn');
        if (editBtn) {
          editBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            setEditState(msg.id, msg.text);
          });
        }

        const deleteEveryoneBtn = msgDiv.querySelector('.delete-everyone-btn');
        if (deleteEveryoneBtn) {
          deleteEveryoneBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            deleteForEveryone(msg.id);
          });
        }

        const deleteMeBtn = msgDiv.querySelector('.delete-me-btn');
        if (deleteMeBtn) {
          deleteMeBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            deleteForMe(msg.id);
          });
        }

        reactionPopup.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            toggleReaction(msg.id, btn.dataset.emoji);
            reactionPopup.style.display = 'none';
          });
        });

        msgDiv.querySelectorAll('.reaction-pill').forEach(pill => {
          pill.addEventListener('click', () => {
            toggleReaction(msg.id, pill.dataset.emoji);
          });
        });

        if (msg.type === 'text') {
          const bubble = msgDiv.querySelector('.message-bubble');
          bubble.addEventListener('dblclick', () => {
            navigator.clipboard.writeText(msg.text).then(() => {
              const originalColor = bubble.style.backgroundColor;
              bubble.style.backgroundColor = '#10b981';
              setTimeout(() => bubble.style.backgroundColor = originalColor, 300);
            });
          });
        }

        elements.messagesContainer.appendChild(msgDiv);
      });

      elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
