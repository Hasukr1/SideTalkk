<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SideTalk — Simple & Clean Live Chat</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --msg-sent: #6366f1;
      --msg-sent-text: #ffffff;
      --msg-received: #f1f5f9;
      --msg-received-text: #0f172a;
      --border: #e2e8f0;
      --header-bg: rgba(255, 255, 255, 0.9);
      --toolbar-bg: #f8fafc;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-received: #334155;
      --msg-received-text: #f8fafc;
      --border: #334155;
      --header-bg: rgba(30, 41, 59, 0.9);
      --toolbar-bg: #0f172a;
      --input-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      transition: background 0.3s ease;
    }

    /* Auth / Login Overlay Screen */
    .auth-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 2rem;
      transition: background 0.3s ease;
    }

    .auth-box {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .auth-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    /* Floating Chat Shell */
    .chat-app {
      width: 100%;
      max-width: 650px;
      height: 85vh;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.15);
      display: none; /* Hidden until login */
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.3s ease, border 0.3s ease;
    }

    /* Header */
    .chat-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      transition: background 0.3s ease, border 0.3s ease;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .online-badge {
      font-size: 0.75rem;
      background: var(--msg-received);
      color: var(--text-main);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .user-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Animated Theme Toggle Button */
    .theme-toggle-btn {
      background: var(--msg-received);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease, border 0.3s ease;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.1);
    }

    .theme-toggle-btn.rotate {
      transform: rotate(360deg) scale(1);
    }

    /* Messages Display */
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-info {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      padding: 0 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .message-actions-triggers {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn-trigger {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.7rem;
      cursor: pointer;
      font-weight: 600;
    }

    .action-btn-trigger:hover {
      text-decoration: underline;
    }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      cursor: pointer;
      position: relative;
    }

    .message.sent .message-bubble {
      background-color: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background-color: var(--msg-received);
      color: var(--msg-received-text);
      border-bottom-left-radius: 4px;
    }

    .edited-tag {
      font-size: 0.7rem;
      opacity: 0.75;
      margin-left: 0.3rem;
    }

    /* Quoted Reply box inside message bubble */
    .quoted-reply {
      background: rgba(0, 0, 0, 0.1);
      border-left: 3px solid var(--accent);
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 0.4rem;
      opacity: 0.9;
    }

    .message-bubble img.gif-img {
      max-width: 200px;
      border-radius: 12px;
      display: block;
      margin-top: 0.3rem;
    }

    /* Message Reactions Container */
    .message-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }

    .reaction-pill {
      background: var(--msg-received);
      border: 1px solid var(--border);
      padding: 0.15rem 0.45rem;
      border-radius: 12px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      cursor: pointer;
      color: var(--text-main);
      transition: background 0.2s, transform 0.1s;
    }

    .reaction-pill:hover {
      transform: scale(1.05);
    }

    .reaction-pill.user-reacted {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
    }

    /* Toolbar for Emojis & GIFs */
    .quick-toolbar {
      padding: 0.4rem 1rem;
      display: flex;
      gap: 0.3rem;
      background: var(--toolbar-bg);
      border-top: 1px solid var(--border);
      align-items: center;
      transition: background 0.3s ease;
      overflow-x: auto;
      white-space: nowrap;
    }

    .quick-toolbar::-webkit-scrollbar {
      display: none;
    }

    .tool-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: background 0.2s;
      color: var(--text-main);
    }

    .tool-btn:hover {
      background: var(--msg-received);
    }

    /* Reply / Edit Preview Banner above input */
    .preview-bar {
      display: none;
      background: var(--toolbar-bg);
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--border);
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .preview-content {
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .cancel-preview-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      padding: 0 0.4rem;
    }

    .cancel-preview-btn:hover {
      color: var(--text-main);
    }

    /* Input Controls */
    .input-area {
      padding: 0.8rem 1rem 1rem 1rem;
      display: flex;
      gap: 0.6rem;
      background: var(--toolbar-bg);
      transition: background 0.3s ease;
    }

    .chat-input {
      flex: 1;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      outline: none;
      font-size: 0.95rem;
      transition: border 0.2s, background 0.3s ease, color 0.3s ease;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal for GIF Selection */
    .gif-modal {
      display: none;
      position: absolute;
      bottom: 110px;
      left: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 1rem;
      z-index: 100;
    }

    .gif-custom-link {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .gif-custom-link input {
      padding: 0.5rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .gif-custom-link button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-height: 220px;
      overflow-y: auto;
    }

    .gif-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .gif-grid img:hover {
      transform: scale(1.05);
    }

    /* Toggleable Full Emoji Picker Popup */
    .emoji-picker-modal {
      display: none;
      position: absolute;
      bottom: 110px;
      left: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 1rem;
      z-index: 100;
      max-height: 260px;
      overflow-y: auto;
    }

    .emoji-picker-category {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0.5rem 0 0.3rem 0;
      text-transform: uppercase;
    }

    .emoji-picker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.3rem;
    }

    .emoji-picker-item {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 8px;
      transition: background 0.1s, transform 0.1s;
      text-align: center;
    }

    .emoji-picker-item:hover {
      background: var(--msg-received);
      transform: scale(1.15);
    }

    /* Reaction & Action Popups */
    .reaction-popup {
      display: none;
      position: absolute;
      bottom: 105%;
      left: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      border-radius: 20px;
      padding: 0.3rem 0.6rem;
      gap: 0.4rem;
      z-index: 50;
      align-items: center;
    }

    .reaction-popup button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .reaction-popup button:hover {
      transform: scale(1.25);
    }

    /* Message Options Menu (Edit / Delete) */
    .options-popup {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      border-radius: 12px;
      padding: 0.3rem;
      z-index: 50;
      min-width: 130px;
      display: none;
      flex-direction: column;
      gap: 0.2rem;
    }

    .options-popup button {
      background: none;
      border: none;
      padding: 0.4rem 0.8rem;
      text-align: left;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 6px;
      font-weight: 500;
    }

    .options-popup button:hover {
      background: var(--msg-received);
    }

    .options-popup button.danger {
      color: #ef4444;
    }
  </style>
</head>

      storageBucket: "sidetalkk.firebasestorage.app",
      messagingSenderId: "585493665739",
      appId: "1:585493665739:web:e4b00ea7117e71fcb2084e",
      measurementId: "G-6SYMK7PYGY",
      databaseURL: "https://sidetalkk-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');
    const usersRef = ref(db, 'users');

    const blockedWords = [
      "fuck", "shit", "bitch", "asshole", "cunt", "nigger", "nigga", 
      "faggot", "retard", "whore", "slut", "dick", "pussy", "cock", 
      "bastard", "motherfucker", "gook", "chink", "spic", "tranny"
    ];

    function containsProfanity(text) {
      if (!text) return false;
      const lower = text.toLowerCase();
      return blockedWords.some(word => {
        const regex = new RegExp(`\\b${word}\\b`, 'i');
        return regex.test(lower) || lower.includes(word);
      });
    }

    const presetGIFs = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3A5MHFvZzN2ZjB1dDJzbHN4ZmprZjBiaThseXlyM3Y1bWV0dDNwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Cmr1OMJ2FN0B2/giphy.gif",
      "https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif",
      "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif",
      "https://media.giphy.com/media/3o7TKsjLuLXS26CD6w/giphy.gif",
      "https://media.giphy.com/media/26n6WywJyh39n1pBu/giphy.gif",
      "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
      "https://media.giphy.com/media/YRtLgsajXrz1FNJ6oy/giphy.gif",
      "https://media.giphy.com/media/3o6Zt4HU9uwXmXSAuI/giphy.gif",
      "https://media.giphy.com/media/L0qTl8hl84EDly62J1/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/B0vFTrb0ZGDf2/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/fDO2Nm0RDUtXhsycr8/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/111ebonMs90YLu/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGxzbnVwMWd2NjhpZmxhYXR1dHA3bWFocG81bXZtbHFtbWFrcnhlYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/5VKbvrjvwVcj6/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGI3cW1yd3Roc3V4cnYydzBwMDIxeG1nczB0cm0zbHB4YzByZjZqdiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/4ilFRqgbzbx4c/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHBpY2psZmhhZGxrbTVsc2FtdjN6ODltaGtkYng1aHFvYTh4cHVtYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o7aD2saalEvTehRO0/giphy.gif"
    ];

    const state = {
      user: localStorage.getItem('sidetalk_user') || '',
      theme: localStorage.getItem('sidetalk_theme') || 'light',
      messages: [],
      replyingTo: null,
      editingMsgId: null,
      deletedForMe: JSON.parse(localStorage.getItem('sidetalk_deleted_for_me') || '[]')
    };

    const elements = {
      authScreen: document.getElementById('authScreen'),
      chatApp: document.getElementById('chatApp'),
      loginUsernameInput: document.getElementById('loginUsernameInput'),
      loginBtn: document.getElementById('loginBtn'),
      displayUserTag: document.getElementById('displayUserTag'),
      onlineBadge: document.getElementById('onlineBadge'),
      messagesContainer: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      gifToggleBtn: document.getElementById('gifToggleBtn'),
      gifModal: document.getElementById('gifModal'),
      gifGrid: document.getElementById('gifGrid'),
      gifLinkInput: document.getElementById('gifLinkInput'),
      sendGifLinkBtn: document.getElementById('sendGifLinkBtn'),
      themeToggleBtn: document.getElementById('themeToggleBtn'),
      previewBar: document.getElementById('previewBar'),
      previewText: document.getElementById('previewText'),
      cancelPreviewBtn: document.getElementById('cancelPreviewBtn'),
      emojiPickerToggleBtn: document.getElementById('emojiPickerToggleBtn'),
      emojiPickerModal: document.getElementById('emojiPickerModal')
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.body.setAttribute('data-theme', state.theme);
      elements.themeToggleBtn.textContent = state.theme === 'dark' ? '☀️' : '🌙';

      if (state.user) {
        startChatSession(state.user);
      }

      setupListeners();
      loadGIFs();
      listenForOnlineUsers();
    });

    function setupListeners() {
      elements.loginBtn.addEventListener('click', () => handleLogin());
      elements.loginUsernameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
      });

      elements.themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('sidetalk_theme', newTheme);

        elements.themeToggleBtn.classList.add('rotate');
        elements.themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        setTimeout(() => elements.themeToggleBtn.classList.remove('rotate'), 400);
      });

      elements.sendBtn.addEventListener('click', () => handleMainAction());
      elements.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleMainAction();
        }
      });

      // Quick toolbar emojis
      document.querySelectorAll('.quick-toolbar .tool-btn[data-emoji]').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.dataset.emoji;
          elements.messageInput.focus();
        });
      });

      // Full Emoji Picker Toggle
      elements.emojiPickerToggleBtn.addEventListener('click', () => {
        const isVisible = elements.emojiPickerModal.style.display === 'block';
        elements.emojiPickerModal.style.display = isVisible ? 'none' : 'block';
        elements.gifModal.style.display = 'none';
      });

      // Full Emoji Picker item click
      document.querySelectorAll('.emoji-picker-item').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.textContent;
          elements.messageInput.focus();
          elements.emojiPickerModal.style.display = 'none';
        });
      });

      elements.gifToggleBtn.addEventListener('click', () => {
        const isVisible = elements.gifModal.style.display === 'block';
        elements.gifModal.style.display = isVisible ? 'none' : 'block';
        elements.emojiPickerModal.style.display = 'none';
      });

      elements.sendGifLinkBtn.addEventListener('click', () => {
        const url = elements.gifLinkInput.value.trim();
        if (url) {
          sendGIFMessage(url);
          elements.gifLinkInput.value = '';
          elements.gifModal.style.display = 'none';
        }
      });

      elements.cancelPreviewBtn.addEventListener('click', () => {
        clearActiveState();
      });

      // Close popups when clicking outside
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.emoji-picker-modal') && !e.target.closest('#emojiPickerToggleBtn') &&
            !e.target.closest('.gif-modal') && !e.target.closest('#gifToggleBtn') && 
            !e.target.closest('.reaction-popup') && !e.target.closest('.options-popup') &&
            !e.target.closest('.action-btn-trigger')) {
          elements.emojiPickerModal.style.display = 'none';
          elements.gifModal.style.display = 'none';
          document.querySelectorAll('.reaction-popup').forEach(p => p.style.display = 'none');
          document.querySelectorAll('.options-popup').forEach(p => p.style.display = 'none');
        }
      });
    }

    async function handleLogin() {
      const name = elements.loginUsernameInput.value.trim();
      if (!name) {
        alert("Please enter a valid nickname!");
        return;
      }

      if (containsProfanity(name)) {
        alert("This nickname contains restricted words, profanity, or slurs.");
        return;
      }

      try {
        const userRef = ref(db, 'users/' + name);
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
          alert("This username is already taken by someone online! Please choose a different nickname.");
          return;
        }
        await set(userRef, { online: true, lastLogin: Date.now() });
        onDisconnect(userRef).remove();
      } catch (err) {
        console.error(err);
      }

      state.user = name;
      localStorage.setItem('sidetalk_user', name);
      startChatSession(name);
    }

    function startChatSession(username) {
      elements.authScreen.style.display = 'none';
      elements.chatApp.style.display = 'flex';
      elements.displayUserTag.textContent = username;
      listenForFirebaseMessages();
    }

    function listenForOnlineUsers() {
      onValue(usersRef, (snapshot) => {
        const data = snapshot.val();
        const count = data ? Object.keys(data).length : 0;
        elements.onlineBadge.textContent = `🟢 ${count} Online`;
      });
    }

    function loadGIFs() {
      elements.gifGrid.innerHTML = '';
      presetGIFs.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.addEventListener('click', () => {
          sendGIFMessage(url);
          elements.gifModal.style.display = 'none';
        });
        elements.gifGrid.appendChild(img);
      });
    }

    function setReplyState(sender, text) {
      state.editingMsgId = null;
      state.replyingTo = { sender, text };
      elements.previewText.textContent = `Replying to ${sender}: ${text}`;
      elements.previewBar.style.display = 'flex';
      elements.messageInput.focus();
    }

    function setEditState(msgId, currentText) {
      state.replyingTo = null;
      state.editingMsgId = msgId;
      elements.messageInput.value = currentText;
      elements.previewText.textContent = `Editing message: ${currentText}`;
      elements.previewBar.style.display = 'flex';
      elements.messageInput.focus();
    }

    function clearActiveState() {
      state.replyingTo = null;
      state.editingMsgId = null;
      elements.messageInput.value = '';
      elements.previewBar.style.display = 'none';
    }

    function handleMainAction() {
      const text = elements.messageInput.value.trim();
      if (!text) return;

      if (containsProfanity(text)) {
        alert("Your message contains inappropriate language or slurs and cannot be sent.");
        return;
      }

      if (state.editingMsgId) {
        // Edit existing message in Firebase
        const msgRef = ref(db, `messages/${state.editingMsgId}`);
        update(msgRef, { text: text, edited: true }).then(() => {
          clearActiveState();
        }).catch(err => {
          alert("Failed to edit message: " + err.message);
        });
      } else {
        // Send new text message
        const payload = { text: text, type: 'text' };
        if (state.replyingTo) {
          payload.replyTo = state.replyingTo;
        }
        pushMessageToFirebase(payload);
        elements.messageInput.value = '';
        clearActiveState();
      }
    }

    function sendGIFMessage(url) {
      if (containsProfanity(url)) {
        alert("Invalid link.");
        return;
      }
      const payload = { url: url, type: 'gif' };
      if (state.replyingTo) {
        payload.replyTo = state.replyingTo;
      }

      pushMessageToFirebase(payload);
      clearActiveState();
    }

    function pushMessageToFirebase(payload) {
      const msg = {
        sender: state.user,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now(),
        ...payload
      };

      push(messagesRef, msg).catch((error) => {
        alert("Failed to send! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function deleteForEveryone(msgId) {
      if (confirm("Delete this message for everyone?")) {
        remove(ref(db, `messages/${msgId}`)).catch(err => {
          alert("Failed to delete: " + err.message);
        });
      }
    }

    function deleteForMe(msgId) {
      state.deletedForMe.push(msgId);
      localStorage.setItem('sidetalk_deleted_for_me', JSON.stringify(state.deletedForMe));
      renderMessages();
    }

    function toggleReaction(msgId, emoji) {
      const reactionsRef = ref(db, `messages/${msgId}/reactions`);
      get(reactionsRef).then((snapshot) => {
        let reactions = snapshot.exists() ? snapshot.val() : {};
        if (!reactions[emoji]) {
          reactions[emoji] = {};
        }

        if (reactions[emoji][state.user]) {
          delete reactions[emoji][state.user];
          if (Object.keys(reactions[emoji]).length === 0) {
            delete reactions[emoji];
          }
        } else {
          reactions[emoji][state.user] = true;
        }

        set(reactionsRef, reactions);
      });
    }

    function listenForFirebaseMessages() {
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        state.messages = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            state.messages.push({ id: key, ...data[key] });
          });

          state.messages.sort((a, b) => a.createdAt - b.createdAt);
        }
        
        renderMessages();
      }, (error) => {
        alert("Failed to load messages! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function renderMessages() {
      elements.messagesContainer.innerHTML = '';

      state.messages.forEach(msg => {
        // Skip if deleted locally by user
        if (state.deletedForMe.includes(msg.id)) return;

        const isMe = msg.sender === state.user;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;

        let replyHTML = '';
        if (msg.replyTo) {
          replyHTML = `
            <div class="quoted-reply">
              <strong>@${escapeHTML(msg.replyTo.sender)}</strong>: ${escapeHTML(msg.replyTo.text)}
            </div>
          `;
        }

        let contentHTML = '';
        if (msg.type === 'gif') {
          contentHTML = `<img src="${msg.url}" class="gif-img" alt="GIF/Image" />`;
        } else {
          const editedLabel = msg.edited ? `<span class="edited-tag">(edited)</span>` : '';
          contentHTML = `${escapeHTML(msg.text)}${editedLabel}`;
        }

        // Render Reactions HTML
        let reactionsHTML = '';
        if (msg.reactions) {
          reactionsHTML = '<div class="message-reactions">';
          Object.keys(msg.reactions).forEach(emoji => {
            const usersObj = msg.reactions[emoji];
            const count = Object.keys(usersObj).length;
            const userReacted = usersObj[state.user] ? 'user-reacted' : '';
            reactionsHTML += `
              <div class="reaction-pill ${userReacted}" data-emoji="${emoji}">
                <span>${emoji}</span> <span>${count}</span>
              </div>
            `;
          });
          reactionsHTML += '</div>';
        }

        // Build options menu based on ownership
        let optionsButtonsHTML = `<button class="delete-me-btn">Delete for me</button>`;
        if (isMe && msg.type === 'text') {
          optionsButtonsHTML = `
            <button class="edit-msg-btn">Edit</button>
            <button class="delete-everyone-btn danger">Delete for everyone</button>
            <button class="delete-me-btn">Delete for me</button>
          `;
        } else if (isMe && msg.type === 'gif') {
          optionsButtonsHTML = `
            <button class="delete-everyone-btn danger">Delete for everyone</button>
            <button class="delete-me-btn">Delete for me</button>
          `;
        }

        msgDiv.innerHTML = `
          <div class="message-info">
            <span>${msg.sender} • ${msg.timestamp}</span>
            <div class="message-actions-triggers">
              <button class="action-btn-trigger react-trigger">React</button>
              <button class="action-btn-trigger reply-btn-trigger">Reply</button>
              <button class="action-btn-trigger options-trigger">⋮</button>
            </div>
          </div>
          <div class="message-bubble" title="Double-click to copy message">
            ${replyHTML}${contentHTML}
            <div class="reaction-popup">
              <button data-emoji="👍">👍</button>
              <button data-emoji="❤️">❤️</button>
              <button data-emoji="😂">😂</button>
              <button data-emoji="🔥">🔥</button>
              <button data-emoji="💀">💀</button>
            </div>
            <div class="options-popup">
              ${optionsButtonsHTML}
            </div>
          </div>
          ${reactionsHTML}
        `;

        // Wire up Reply button
        const replyBtn = msgDiv.querySelector('.reply-btn-trigger');
        replyBtn.addEventListener('click', () => {
          const snippet = msg.type === 'gif' ? '[GIF/Image]' : msg.text;
          setReplyState(msg.sender, snippet);
        });

        // Wire up React trigger popup
        const reactTrigger = msgDiv.querySelector('.react-trigger');
        const reactionPopup = msgDiv.querySelector('.reaction-popup');
        reactTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.reaction-popup').forEach(p => { if (p !== reactionPopup) p.style.display = 'none'; });
          document.querySelectorAll('.options-popup').forEach(p => p.style.display = 'none');
          reactionPopup.style.display = reactionPopup.style.display === 'flex' ? 'none' : 'flex';
        });

        // Wire up Options trigger popup
        const optionsTrigger = msgDiv.querySelector('.options-trigger');
        const optionsPopup = msgDiv.querySelector('.options-popup');
        optionsTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.options-popup').forEach(p => { if (p !== optionsPopup) p.style.display = 'none'; });
          document.querySelectorAll('.reaction-popup').forEach(p => p.style.display = 'none');
          optionsPopup.style.display = optionsPopup.style.display === 'flex' ? 'none' : 'flex';
        });

        // Edit button
        const editBtn = msgDiv.querySelector('.edit-msg-btn');
        if (editBtn) {
          editBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            setEditState(msg.id, msg.text);
          });
        }

        // Delete for everyone button
        const deleteEveryoneBtn = msgDiv.querySelector('.delete-everyone-btn');
        if (deleteEveryoneBtn) {
          deleteEveryoneBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            deleteForEveryone(msg.id);
          });
        }

        // Delete for me button
        const deleteMeBtn = msgDiv.querySelector('.delete-me-btn');
        if (deleteMeBtn) {
          deleteMeBtn.addEventListener('click', () => {
            optionsPopup.style.display = 'none';
            deleteForMe(msg.id);
          });
        }

        // Wire up reaction popup emoji choices
        reactionPopup.querySelectorAll('button').forEach(btn => {
          btn.addEventListener('click', () => {
            toggleReaction(msg.id, btn.dataset.emoji);
            reactionPopup.style.display = 'none';
          });
        });

        // Wire up existing reaction pills to toggle vote
        msgDiv.querySelectorAll('.reaction-pill').forEach(pill => {
          pill.addEventListener('click', () => {
            toggleReaction(msg.id, pill.dataset.emoji);
          });
        });

        if (msg.type === 'text') {
          const bubble = msgDiv.querySelector('.message-bubble');
          bubble.addEventListener('dblclick', () => {
            navigator.clipboard.writeText(msg.text).then(() => {
              const originalColor = bubble.style.backgroundColor;
              bubble.style.backgroundColor = '#10b981';
              setTimeout(() => bubble.style.backgroundColor = originalColor, 300);
            });
          });
        }

        elements.messagesContainer.appendChild(msgDiv);
      });

      elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
