  // --- AUDIO SYNTHESIS (Web Audio API) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playBeep(freq = 580, type = 'sine', duration = 0.08) {
    if (isMuted) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  function formatBytes(bytes, decimals = 1) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const dm = decimals < 0 ? 0 : decimals;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
  }

  // --- FIREBASE REALTIME SYNC & MOCK FALLBACK ---
  function setupListeners() {
    if (isFirebaseInitialized && db) {
      try {
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
          localMessages = [];
          snapshot.forEach((docSnap) => {
            localMessages.push({ id: docSnap.id, ...docSnap.data() });
          });
          renderMessages();
        }, (err) => {
          console.warn("Firestore snapshot error, falling back to local storage sync.", err);
          loadLocalMessages();
        });

        // Presence heartbeat
        const userRef = doc(db, "presence", currentUser);
        setDoc(userRef, { name: currentUser, lastSeen: serverTimestamp() }, { merge: true });
        setInterval(() => {
          setDoc(userRef, { lastSeen: serverTimestamp() }, { merge: true });
        }, 15000);

        const onlineQuery = collection(db, "presence");
        onSnapshot(onlineQuery, (snapshot) => {
          onlineUsersMap.clear();
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            onlineUsersMap.set(docSnap.id, data);
          });
          updateUserListUI();
        });
      } catch(e) {
        loadLocalMessages();
      }
    } else {
      loadLocalMessages();
    }
  }

  function loadLocalMessages() {
    const saved = localStorage.getItem("sidetalkk_local_msgs");
    if (saved) {
      try { localMessages = JSON.parse(saved); } catch(e) { localMessages = []; }
    } else {
      // Default welcome message
      localMessages = [{
        id: 'msg_welcome',
        sender: 'SideTalkk Bot',
        text: 'Welcome to #general! Type /roll to test dice rolls, or drop a code block.',
        createdAt: { seconds: Math.floor(Date.now()/1000) },
        reactions: {},
        seenBy: [currentUser]
      }];
    }
    renderMessages();
    updateUserListUI();
  }

  function saveLocalMessages() {
    localStorage.setItem("sidetalkk_local_msgs", JSON.stringify(localMessages));
  }

  function updateUserListUI() {
    userList.innerHTML = '';
    const activeNames = isFirebaseInitialized && onlineUsersMap.size > 0 
      ? Array.from(onlineUsersMap.keys()) 
      : [currentUser, 'SideTalkk Bot'];

    onlineLabel.textContent = `Online — ${activeNames.length}`;
    memberCount.textContent = `${activeNames.length} online`;

    activeNames.forEach(name => {
      const isMe = name === currentUser;
      const item = document.createElement('div');
      item.className = 'user-item';
      item.innerHTML = `
        <div class="u-avatar" style="background:${getAvatarColor(name)}">
          ${name.charAt(0).toUpperCase()}
          <span class="u-dot"></span>
        </div>
        <span class="u-name">${name}</span>
        ${isMe ? '<span class="u-you">you</span>' : ''}
      `;
      userList.appendChild(item);
    });
  }

  // --- SENDING MESSAGES ---
  sendBtn.addEventListener('click', handleSendMessage);
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSendMessage();
    }
  });

  async function handleSendMessage() {
    const rawText = textInput.value.trim();
    if (!rawText && !activeAttachment) return;

    // Check slash commands
    if (rawText.startsWith('/roll')) {
      handleRollCommand(rawText);
      resetInputState();
      return;
    }
    if (rawText === '/clear') {
      localMessages = [];
      if (!isFirebaseInitialized) saveLocalMessages();
      renderMessages();
      resetInputState();
      showToast("Messages cleared locally");
      return;
    }

    const newMsg = {
      sender: currentUser,
      text: rawText,
      createdAt: serverTimestamp ? serverTimestamp() : { seconds: Math.floor(Date.now()/1000) },
      replyTo: activeReply ? { id: activeReply.id, sender: activeReply.sender, text: activeReply.text } : null,
      attachment: activeAttachment ? { type: activeAttachment.type, name: activeAttachment.name, size: activeAttachment.size, data: activeAttachment.data } : null,
      reactions: {},
      seenBy: [currentUser]
    };

    try {
      if (isFirebaseInitialized && db) {
        await addDoc(collection(db, "messages"), newMsg);
      } else {
        newMsg.id = 'msg_' + Date.now();
        newMsg.createdAt = { seconds: Math.floor(Date.now()/1000) };
        localMessages.push(newMsg);
        saveLocalMessages();
        renderMessages();
      }
      playBeep(640, 'sine', 0.07);
    } catch(e) {
      showToast("Failed to send message.");
    }

    resetInputState();
  }

  async function sendMediaMessage(url, type) {
    const newMsg = {
      sender: currentUser,
      text: '',
      createdAt: serverTimestamp ? serverTimestamp() : { seconds: Math.floor(Date.now()/1000) },
      attachment: { type: type, name: type.toUpperCase(), size: '', data: url },
      reactions: {},
      seenBy: [currentUser]
    };
    if (isFirebaseInitialized && db) {
      await addDoc(collection(db, "messages"), newMsg);
    } else {
      newMsg.id = 'msg_' + Date.now();
      newMsg.createdAt = { seconds: Math.floor(Date.now()/1000) };
      localMessages.push(newMsg);
      saveLocalMessages();
      renderMessages();
    }
    playBeep(640, 'sine', 0.07);
  }

  function handleRollCommand(cmdText) {
    const parts = cmdText.split(' ');
    let notation = '1d6';
    if (parts.length > 1) notation = parts[1].toLowerCase();

    let count = 1, sides = 6;
    const match = notation.match(/^(\d*)d(\d+)$/);
    if (match) {
      count = match[1] ? parseInt(match[1]) : 1;
      sides = parseInt(match[2]);
    }
    count = Math.max(1, Math.min(20, count));
    sides = Math.max(2, Math.min(100, sides));

    let rolls = [];
    let total = 0;
    for (let i = 0; i < count; i++) {
      const r = Math.floor(Math.random() * sides) + 1;
      rolls.push(r);
      total += r;
    }

    const rollMsg = {
      sender: currentUser,
      text: `🎲 Rolled **${notation}**`,
      rollData: { notation, total, rolls },
      createdAt: { seconds: Math.floor(Date.now()/1000) },
      reactions: {},
      seenBy: [currentUser]
    };

    if (isFirebaseInitialized && db) {
      addDoc(collection(db, "messages"), rollMsg);
    } else {
      rollMsg.id = 'msg_' + Date.now();
      localMessages.push(rollMsg);
      saveLocalMessages();
      renderMessages();
    }
    playBeep(720, 'triangle', 0.1);
  }

  function resetInputState() {
    textInput.value = '';
    textInput.style.height = 'auto';
    activeReply = null;
    activeAttachment = null;
    replyingBar.classList.remove('open');
    attachBar.classList.remove('open');
    sendBtn.disabled = true;
    textInput.focus();
  }

  // --- RENDER MESSAGES ---
  function renderMessages() {
    if (!localMessages || localMessages.length === 0) {
      emptyState.style.display = 'block';
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(emptyState);
      return;
    }
    emptyState.style.display = 'none';

    // Keep scroll position if user is viewing history
    const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 80;

    messagesContainer.innerHTML = '';
    localMessages.forEach((msg, idx) => {
      const isMe = msg.sender === currentUser;
      const line = document.createElement('div');
      line.className = `msg-line ${isMe ? 'me' : 'them'}`;

      const avatarColor = getAvatarColor(msg.sender);
      const timeStr = formatMsgTime(msg.createdAt);

      let contentHtml = '';

      // Reply preview if any
      if (msg.replyTo) {
        contentHtml += `
          <div class="reply-preview">
            <span class="rp-sender">${msg.replyTo.sender}</span>
            <span class="rp-text">${msg.replyTo.text || 'Attachment'}</span>
          </div>
        `;
      }

      // Roll card if any
      if (msg.rollData) {
        contentHtml += `
          <div class="bubble roll">
            <div class="roll-icon">🎲</div>
            <div class="roll-notation">${msg.rollData.notation}</div>
            <div class="roll-total">${msg.rollData.total}</div>
            <div class="roll-detail">[${msg.rollData.rolls.join(', ')}]</div>
          </div>
        `;
      } else if (msg.text && msg.text.includes('```')) {
        // Parse code blocks
        contentHtml += parseCodeBlocks(msg.text);
      } else {
        // Normal text or attachment
        let innerText = msg.text ? escapeHtml(msg.text) : '';
        // Convert bold markdown **text**
        innerText = innerText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');

        let mediaHtml = '';
        if (msg.attachment) {
          if (msg.attachment.type === 'image' || msg.attachment.type === 'gif') {
            mediaHtml = `<img class="msg-media" src="${msg.attachment.data}" loading="lazy" alt="Media attachment">`;
          } else {
            mediaHtml = `
              <div class="file-card">
                <div class="file-card-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
                </div>
                <div class="file-card-info">
                  <div class="file-card-name">${msg.attachment.name}</div>
                  <div class="file-card-size">${msg.attachment.size}</div>
                </div>
                <a class="file-card-dl" href="${msg.attachment.data}" download="${msg.attachment.name}" title="Download file">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 002-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
                </a>
              </div>
            `;
          }
        }

        contentHtml += `
          <div class="bubble-wrap" data-id="${msg.id || idx}">
            <div class="bubble">
              ${innerText ? `<p class="msg-text">${innerText}</p>` : ''}
              ${mediaHtml}
            </div>

            <!-- QUICK REACTION BAR -->
            <div class="quick-bar">
              <button class="quick-emoji" data-emoji="❤️">❤️</button>
              <button class="quick-emoji" data-emoji="👍">👍</button>
              <button class="quick-emoji" data-emoji="🔥">🔥</button>
              <button class="quick-emoji" data-emoji="😂">😂</button>
              <button class="quick-more" title="More options">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
              </button>
            </div>

            <!-- CONTEXT MENU -->
            <div class="msg-context">
              <button class="ctx-item" data-action="reply">Reply</button>
              <button class="ctx-item" data-action="copy">Copy text</button>
              ${isMe ? `<button class="ctx-item danger" data-action="delete">Delete</button>` : ''}
            </div>
          </div>
        `;
      }

      // Reactions pills
      let reactionsHtml = '';
      if (msg.reactions && Object.keys(msg.reactions).length > 0) {
        reactionsHtml += '<div class="reactions-row">';
        for (const [emoji, users] of Object.entries(msg.reactions)) {
          if (users && users.length > 0) {
            const hasMine = users.includes(currentUser);
            reactionsHtml += `
              <div class="reaction-pill ${hasMine ? 'mine' : ''}" data-emoji="${emoji}" data-msgid="${msg.id || idx}">
                <span>${emoji}</span>
                <span class="rcount">${users.length}</span>
              </div>
            `;
          }
        }
        reactionsHtml += '</div>';
      }

      line.innerHTML = `
        ${!isMe ? `<div class="msg-avatar" style="background:${avatarColor}">${msg.sender.charAt(0).toUpperCase()}</div>` : ''}
        <div class="msg-col">
          ${!isMe ? `<span class="msg-sender">${msg.sender}</span>` : ''}
          ${contentHtml}
          ${reactionsHtml}
          <div class="msg-meta">
            <span class="msg-time">${timeStr}</span>
            ${isMe ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : ''}
          </div>
        </div>
      `;

      messagesContainer.appendChild(line);
    });

    // Highlight code blocks
    document.querySelectorAll('pre code').forEach((block) => {
      hljs.highlightElement(block);
    });

    if (isAtBottom) {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  }

  function parseCodeBlocks(text) {
    const regex = /```([a-z]*)\n([\s\S]*?)```/g;
    let html = '';
    let lastIdx = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
      if (match.index > lastIdx) {
        html += `<div class="bubble"><p class="msg-text">${escapeHtml(text.substring(lastIdx, match.index))}</p></div>`;
      }
      const lang = match[1] || 'plaintext';
      const code = match[2];
      html += `
        <div class="bubble code-block">
          <div class="code-header">
            <span class="code-lang">${lang}</span>
            <button class="code-copy" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.textContent='Copied!'; setTimeout(()=>this.textContent='Copy', 1500)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
              Copy
            </button>
          </div>
          <pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>
        </div>
      `;
      lastIdx = regex.lastIndex;
    }

    if (lastIdx < text.length) {
      const remaining = text.substring(lastIdx).trim();
      if (remaining) {
        html += `<div class="bubble"><p class="msg-text">${escapeHtml(remaining)}</p></div>`;
      }
    }
    return html;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function formatMsgTime(ts) {
    if (!ts) return 'Just now';
    const date = ts.seconds ? new Date(ts.seconds * 1000) : new Date();
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // --- MESSAGE INTERACTIONS (Reactions, Context Menus, Lightbox) ---
  messagesContainer.addEventListener('click', (e) => {
    // Image click lightbox
    if (e.target.tagName === 'IMG' && e.target.classList.contains('msg-media')) {
      openLightbox(e.target.src);
      return;
    }

    // Quick emoji reaction
    const quickEmojiBtn = e.target.closest('.quick-emoji');
    if (quickEmojiBtn) {
      e.stopPropagation();
      const emoji = quickEmojiBtn.getAttribute('data-emoji');
      const wrap = quickEmojiBtn.closest('.bubble-wrap');
      const msgId = wrap.getAttribute('data-id');
      toggleReaction(msgId, emoji);
      wrap.classList.remove('active');
      return;
    }

    // Quick more options button -> toggle context menu
    const quickMoreBtn = e.target.closest('.quick-more');
    if (quickMoreBtn) {
      e.stopPropagation();
      const wrap = quickMoreBtn.closest('.bubble-wrap');
      document.querySelectorAll('.bubble-wrap.active').forEach(w => { if(w!==wrap) w.classList.remove('active'); });
      wrap.classList.toggle('active');
      return;
    }

    // Reaction pill click (toggle reaction)
    const reactionPill = e.target.closest('.reaction-pill');
    if (reactionPill) {
      const emoji = reactionPill.getAttribute('data-emoji');
      const msgId = reactionPill.getAttribute('data-msgid');
      toggleReaction(msgId, emoji);
      return;
    }

    // Context menu item click
    const ctxItem = e.target.closest('.ctx-item');
    if (ctxItem) {
      e.stopPropagation();
      const action = ctxItem.getAttribute('data-action');
      const wrap = ctxItem.closest('.bubble-wrap');
      const msgId = wrap.getAttribute('data-id');
      const msg = localMessages.find(m => (m.id || localMessages.indexOf(m)) == msgId);

      document.querySelectorAll('.msg-context.open').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.bubble-wrap.active').forEach(el => el.classList.remove('active'));

      if (action === 'reply' && msg) {
        activeReply = { id: msgId, sender: msg.sender, text: msg.text || msg.attachment?.name || 'Attachment' };
        replyingToName.textContent = activeReply.sender;
        replyingToText.textContent = activeReply.text;
        replyingBar.classList.add('open');
        textInput.focus();
      } else if (action === 'copy' && msg) {
        navigator.clipboard.writeText(msg.text || '');
        showToast("Text copied to clipboard");
      } else if (action === 'delete') {
        deleteMessage(msgId);
      }
      return;
    }

    // Bubble click toggle quick-bar
    const bubbleWrap = e.target.closest('.bubble-wrap');
    if (bubbleWrap) {
      document.querySelectorAll('.bubble-wrap.active').forEach(w => { if(w!==bubbleWrap) w.classList.remove('active'); });
      bubbleWrap.classList.toggle('active');
    }
  });

  async function toggleReaction(msgId, emoji) {
    const msg = localMessages.find(m => (m.id || localMessages.indexOf(m)) == msgId);
    if (!msg) return;

    if (!msg.reactions) msg.reactions = {};
    if (!msg.reactions[emoji]) msg.reactions[emoji] = [];

    const idx = msg.reactions[emoji].indexOf(currentUser);
    if (idx > -1) {
      msg.reactions[emoji].splice(idx, 1);
      if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
    } else {
      msg.reactions[emoji].push(currentUser);
    }

    if (isFirebaseInitialized && db && msg.id && !msg.id.toString().startsWith('msg_')) {
      try {
        const msgRef = doc(db, "messages", msg.id);
        await updateDoc(msgRef, { reactions: msg.reactions });
      } catch(e) {}
    } else {
      saveLocalMessages();
      renderMessages();
    }
  }

  async function deleteMessage(msgId) {
    const idx = localMessages.findIndex(m => (m.id || localMessages.indexOf(m)) == msgId);
    if (idx === -1) return;
    const msg = localMessages[idx];

    if (isFirebaseInitialized && db && msg.id && !msg.id.toString().startsWith('msg_')) {
      try {
        await deleteDoc(doc(db, "messages", msg.id));
      } catch(e) {}
    } else {
      localMessages.splice(idx, 1);
      saveLocalMessages();
      renderMessages();
    }
    showToast("Message deleted");
  }

</script>
</body>
