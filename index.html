<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideTalkk</title>
  <!-- Crypto-JS for hashing passwords -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.75);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --sent: #4f46e5;
      --recv: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0b0f19 60%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
    }

    /* Auth Screens Modal */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 32px;
      border-radius: 16px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .auth-box h2 { text-align: center; color: var(--text); }

    .auth-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }

    .auth-switch {
      font-size: 0.85rem;
      text-align: center;
      color: var(--subtext);
      cursor: pointer;
    }

    .auth-switch:hover { text-decoration: underline; color: var(--text); }

    /* Main Chat UI */
    .chat-card {
      width: 100%;
      max-width: 800px;
      height: 88vh;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      padding: 16px 24px;
      background: rgba(11, 15, 25, 0.5);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    .messages-container {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-group {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-group.sent { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .sent .msg-body { align-items: flex-end; }

    .msg-meta { font-size: 0.75rem; color: var(--subtext); display: flex; gap: 8px; }

    .reply-preview-bubble {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      color: var(--subtext);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .received .bubble { background: var(--recv); border-top-left-radius: 2px; border: 1px solid var(--border); }
    .sent .bubble { background: var(--sent); border-top-right-radius: 2px; color: #fff; }

    .reply-btn {
      font-size: 0.7rem;
      color: var(--subtext);
      cursor: pointer;
      margin-top: 2px;
    }
    .reply-btn:hover { color: var(--text); }

    /* Active Reply Banner above input */
    .active-reply-bar {
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.85rem;
      color: var(--subtext);
      display: none;
      justify-content: space-between;
      align-items: center;
    }
    .active-reply-bar button { background: none; border: none; color: #ef4444; cursor: pointer; }

    /* Footer & Inputs */
    .footer {
      padding: 16px 24px;
      background: rgba(11, 15, 25, 0.5);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      position: relative;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      outline: none;
    }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 8px;
    }

    /* Emoji Picker Box */
    .emoji-picker {
      position: absolute;
      bottom: 80px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .emoji-picker span {
      font-size: 1.4rem;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s;
    }
    .emoji-picker span:hover { transform: scale(1.2); }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div class="auth-overlay" id="authOverlay">
    <!-- LOGIN BOX -->
    <div class="auth-box" id="loginBox">
      <h2>SideTalkk Login</h2>
      <input type="text" id="loginUser" class="auth-input" placeholder="Username">
      <input type="password" id="loginPass" class="auth-input" placeholder="Password">
      <button class="btn" id="btnLogin">Log In</button>
      <div class="auth-switch" onclick="toggleAuth(true)">Don't have an account? Register</div>
    </div>

    <!-- REGISTER BOX -->
    <div class="auth-box" id="regBox" style="display: none;">
      <h2>Register</h2>
      <input type="text" id="regUser" class="auth-input" placeholder="Username">
      <input type="password" id="regPass" class="auth-input" placeholder="Password">
      <button class="btn" id="btnReg">Create Account</button>
      <div class="auth-switch" onclick="toggleAuth(false)">Already have an account? Log In</div>
    </div>
  </div>

  <!-- CHAT UI -->
  <div class="chat-card">
    <div class="header">
      <div class="brand">
        <div class="status-dot"></div>
        <h2>SideTalkk</h2>
      </div>
      <div>
        <span id="currentUserName">Not logged in</span>
        <button onclick="logout()" style="background: none; border: none; color: #ef4444; margin-left: 10px; cursor: pointer;">Logout</button>
      </div>
    </div>

    <div class="messages-container" id="chatBox"></div>

    <div class="active-reply-bar" id="replyBar">
      <span id="replyText">Replying to...</span>
      <button onclick="cancelReply()">✕</button>
    </div>

    <!-- EMOJI PICKER MENU -->
    <div class="emoji-picker" id="emojiPicker">
      <span>😀</span><span>😂</span><span>🔥</span><span>❤️</span><span>👍</span>
      <span>😎</span><span>💀</span><span>🎉</span><span>😭</span><span>✨</span>
    </div>

    <form class="footer" id="chatForm">
      <button type="button" class="emoji-btn" id="emojiToggle">😊</button>
      <input type="text" id="msgInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="btn">Send</button>
    </form>
  </div>

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // REPLACE THIS WITH YOUR FIREBASE DATABASE URL FROM YOUR FIREBASE CONSOLE!
    const firebaseConfig = {
      databaseURL: "https://simple-chat-e1a19-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = localStorage.getItem('st_user') || null;
    let selectedReply = null;

    if (currentUser) {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUserName').innerText = currentUser;
    }

    // Toggle Login/Register screens
    window.toggleAuth = (showReg) => {
      document.getElementById('loginBox').style.display = showReg ? 'none' : 'flex';
      document.getElementById('regBox').style.display = showReg ? 'flex' : 'none';
    };

    // Hash Password
    function hash(text) {
      return CryptoJS.SHA256(text).toString();
    }

    // REGISTER ACCOUNT
    document.getElementById('btnReg').onclick = async () => {
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      if (!user || !pass) return alert("Fill in all fields!");

      const userRef = ref(db, 'users/' + user);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        alert("Username already taken!");
      } else {
        await push(userRef, { password: hash(pass) });
        alert("Account created! Logging you in...");
        loginUser(user);
      }
    };

    // LOGIN ACCOUNT
    document.getElementById('btnLogin').onclick = async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (!user || !pass) return alert("Fill in all fields!");

      const snapshot = await get(child(ref(db), 'users/' + user));

      if (snapshot.exists()) {
        const data = Object.values(snapshot.val())[0];
        if (data.password === hash(pass)) {
          loginUser(user);
        } else {
          alert("Incorrect password!");
        }
      } else {
        alert("User does not exist!");
      }
    };

    function loginUser(user) {
      currentUser = user;
      localStorage.setItem('st_user', user);
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('currentUserName').innerText = currentUser;
    }

    window.logout = () => {
      localStorage.removeItem('st_user');
      location.reload();
    };

    // EMOJI TOGGLE
    const emojiPicker = document.getElementById('emojiPicker');
    document.getElementById('emojiToggle').onclick = () => {
      emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
    };

    document.querySelectorAll('.emoji-picker span').forEach(el => {
      el.onclick = () => {
        document.getElementById('msgInput').value += el.innerText;
        emojiPicker.style.display = 'none';
      };
    });

    // REPLY SYSTEM
    window.startReply = (user, text) => {
      selectedReply = { user, text };
      document.getElementById('replyBar').style.display = 'flex';
      document.getElementById('replyText').innerText = `Replying to ${user}: "${text.substring(0, 25)}..."`;
    };

    window.cancelReply = () => {
      selectedReply = null;
      document.getElementById('replyBar').style.display = 'none';
    };

    // SEND MESSAGE
    document.getElementById('chatForm').onsubmit = (e) => {
      e.preventDefault();
      if (!currentUser) return alert("Log in first!");
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      push(ref(db, 'messages'), {
        user: currentUser,
        text: text,
        reply: selectedReply,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = '';
      cancelReply();
    };

    // LOAD LIVE MESSAGES
    onChildAdded(ref(db, 'messages'), (snapshot) => {
      const data = snapshot.val();
      const isMe = data.user === currentUser;

      const replyHTML = data.reply ? `<div class="reply-preview-bubble"><strong>${data.reply.user}:</strong> ${data.reply.text}</div>` : '';

      const msgHTML = `
        <div class="msg-group ${isMe ? 'sent' : 'received'}">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${data.user}" class="msg-avatar">
          <div class="msg-body">
            <div class="msg-meta">
              <span>${data.user}</span>
              <span>${data.time}</span>
            </div>
            <div class="bubble">
              ${replyHTML}
              ${data.text}
            </div>
            <div class="reply-btn" onclick="startReply('${data.user}', '${data.text.replace(/'/g, "\\'")}')">↩ Reply</div>
          </div>
        </div>
      `;

      const chatBox = document.getElementById('chatBox');
      chatBox.insertAdjacentHTML('beforeend', msgHTML);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
