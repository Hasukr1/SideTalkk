<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SideTalkk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0e14;
    --bg-1:#0f1420;
    --surface:#131826;
    --surface-2:#1a2032;
    --border:#232a3d;
    --text:#e8eaf0;
    --text-muted:#8890a6;
    --accent:#7c5cfc;
    --accent-2:#31e1f2;
    --accent-soft:rgba(124,92,252,0.16);
    --pink:#ff5c8a;
    --danger:#ff6b6b;
    --bubble-me:#2a2452;
    --bubble-them:#171d2c;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-frame: 0 40px 90px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.03);
  }
  html[data-theme="accent"]{
    --bg-0:#eef0fa;
    --bg-1:#f5f6fc;
    --surface:#ffffff;
    --surface-2:#f1f2fb;
    --border:#e3e6f5;
    --text:#1b1f2a;
    --text-muted:#767d95;
    --accent:#6d4fe0;
    --accent-2:#00b6c9;
    --accent-soft:rgba(109,79,224,0.10);
    --bubble-me:#e9e4ff;
    --bubble-them:#f4f5fb;
    --shadow-frame: 0 40px 90px -24px rgba(76,66,140,0.35), 0 0 0 1px rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(124,92,252,0.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(49,225,242,0.16), transparent 45%),
      var(--bg-0);
    background-attachment:fixed;
    transition: background 0.4s ease;
    padding:24px;
  }
  .phone{
    width:390px; max-width:100%; height:820px; max-height:94vh;
    background:var(--bg-1);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-frame);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    border:1px solid var(--border);
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; background:var(--bg-0); border-radius:20px; z-index:50;
    opacity:0.9;
  }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:40px 32px; text-align:center; position:relative; overflow:hidden;
  }
  .login-glow{
    position:absolute; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:0.35; top:-90px; left:50%; transform:translateX(-50%); filter:blur(10px);
    animation: pulseGlow 5s ease-in-out infinite;
  }
  @keyframes pulseGlow{ 0%,100%{opacity:0.25; transform:translateX(-50%) scale(1);} 50%{opacity:0.45; transform:translateX(-50%) scale(1.08);} }
  .login-mark{
    width:64px; height:64px; border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:26px; color:#fff;
    z-index:2; box-shadow:0 12px 30px -8px var(--accent);
  }
  .login-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:26px; color:var(--text); z-index:2; letter-spacing:-0.02em;}
  .login-sub{ font-size:14px; color:var(--text-muted); z-index:2; max-width:260px; line-height:1.5;}
  .login-form{ width:100%; display:flex; flex-direction:column; gap:12px; z-index:2; margin-top:4px;}
  .login-input{
    width:100%; padding:16px 18px; border-radius:var(--radius-md); border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  }
  .login-input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .login-input.error{ border-color:var(--danger); }
  .login-error{
    font-size:12.5px; color:var(--danger); text-align:left; padding:0 4px; min-height:16px; z-index:2;
    display:none;
  }
  .login-error.show{ display:block; animation:dropIn 0.15s ease; }
  .login-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-md);
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff; font-weight:700; font-size:15px; font-family:'Sora',sans-serif; cursor:pointer;
    transition:transform 0.15s, opacity 0.2s; letter-spacing:0.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .login-btn:active{ transform:scale(0.97); }
  .login-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .login-hint{ font-size:12px; color:var(--text-muted); z-index:2; }
  .spinner{
    width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin 0.7s linear infinite; display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- HEADER ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 18px 14px; border-bottom:1px solid var(--border);
    background:var(--bg-1); z-index:10; flex-shrink:0;
  }
  .header-user{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; color:#fff; font-size:15px;
    flex-shrink:0;
  }
  .header-name{ font-family:'Sora',sans-serif; font-weight:600; font-size:15px; color:var(--text); }
  .header-status{ font-size:11px; color:var(--accent-2); font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:5px;}
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 6px var(--accent-2); }
  .header-actions{ display:flex; align-items:center; gap:8px; position:relative; }
  .icon-btn{
    width:36px; height:36px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); transition:background 0.15s, transform 0.15s;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform:scale(0.92); }
  .settings-menu{
    position:absolute; top:44px; right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:6px; width:170px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.5);
    display:none; flex-direction:column; z-index:60;
  }
  .settings-menu.open{ display:flex; animation:dropIn 0.16s ease; }
  @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .settings-item{
    padding:10px 12px; border-radius:8px; font-size:13.5px; color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; background:none; border:none; text-align:left; width:100%;
  }
  .settings-item:hover{ background:var(--surface-2); }
  .settings-item.danger{ color:var(--danger); }

  /* ---------- MESSAGES ---------- */
  .messages{
    flex:1; min-height:0; overflow-y:auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  .messages::-webkit-scrollbar{ width:5px; }
  .messages::-webkit-scrollbar-track{ background:transparent; }
  .messages::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .msg-row{ display:flex; flex-direction:column; max-width:78%; animation:msgIn 0.28s cubic-bezier(.2,.8,.2,1); position:relative; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(10px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1);} }
  .msg-row.me{ align-self:flex-end; align-items:flex-end; }
  .msg-row.them{ align-self:flex-start; align-items:flex-start; }
  .msg-sender{ font-size:11px; color:var(--accent-2); font-family:'JetBrains Mono',monospace; margin:0 4px 4px; }

  .bubble-wrap{ position:relative; }
  .bubble{
    padding:11px 14px; border-radius:var(--radius-md); font-size:14.5px; line-height:1.45; color:var(--text);
    word-wrap:break-word; position:relative; cursor:pointer; transition:filter 0.15s;
  }
  .msg-row.me .bubble{
    background:var(--bubble-me); border-bottom-right-radius:5px;
    box-shadow: inset 0 0 0 1px rgba(124,92,252,0.25);
  }
  .msg-row.them .bubble{ background:var(--bubble-them); border-bottom-left-radius:5px; border:1px solid var(--border); }
  .bubble.unsent{ font-style:italic; color:var(--text-muted); }
  .bubble img.msg-media{ max-width:220px; border-radius:12px; display:block; margin-top:2px; }
  .bubble .msg-text{ margin:0; }

  .reply-preview{
    border-left:3px solid var(--accent); background:rgba(124,92,252,0.1); border-radius:8px;
    padding:5px 9px; margin-bottom:6px; font-size:12px; cursor:pointer;
  }
  .reply-preview .rp-sender{ color:var(--accent-2); font-weight:600; font-family:'JetBrains Mono',monospace; font-size:11px; }
  .reply-preview .rp-text{ color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; max-width:220px; }

  .msg-meta{ display:flex; align-items:center; gap:6px; margin-top:4px; padding:0 4px; }
  .msg-time{ font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }

  .reactions-row{ display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .reaction-pill{
    display:flex; align-items:center; gap:3px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:2px 8px; font-size:12px; cursor:pointer; transition:transform 0.12s, border-color 0.15s;
  }
  .reaction-pill.mine{ border-color:var(--accent); background:var(--accent-soft); }
  .reaction-pill:active{ transform:scale(0.92); }

  /* hover/quick action bar */
  .quick-bar{
    position:absolute; top:-38px; display:flex; gap:2px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:4px; box-shadow:0 10px 24px -8px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transform:translateY(6px) scale(0.9); transition:opacity 0.15s, transform 0.15s; z-index:40;
  }
  .msg-row.me .quick-bar{ right:0; }
  .msg-row.them .quick-bar{ left:0; }
  .bubble-wrap.active .quick-bar{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
  .quick-emoji{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; transition:transform 0.12s; background:none; border:none;}
  .quick-emoji:hover{ transform:scale(1.25); }
  .quick-more{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); background:none; border:none;}
  .quick-more:hover{ background:var(--surface-2); color:var(--text); }

  .msg-context{
    position:absolute; top:0; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:6px; width:168px; box-shadow:0 20px 40px -10px rgba(0,0,0,0.5); z-index:70; display:none; flex-direction:column;
  }
  .msg-row.me .msg-context{ right:0; }
  .msg-row.them .msg-context{ left:0; }
  .msg-context.open{ display:flex; animation:dropIn 0.15s ease; }
  .ctx-item{ padding:9px 10px; border-radius:8px; font-size:13px; color:var(--text); cursor:pointer; background:none; border:none; text-align:left; font-family:'Inter',sans-serif; }
  .ctx-item:hover{ background:var(--surface-2); }
  .ctx-item.danger{ color:var(--danger); }

  .day-divider{ align-self:center; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; background:var(--surface); padding:4px 12px; border-radius:20px; margin:6px 0; }

  /* ---------- REPLY BAR ---------- */
  .replying-bar{
    display:none; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--surface-2);
    border-top:1px solid var(--border); font-size:12.5px; flex-shrink:0;
  }
  .replying-bar.open{ display:flex; animation:dropIn 0.15s ease; }
  .replying-info{ display:flex; flex-direction:column; border-left:3px solid var(--accent); padding-left:8px; overflow:hidden; }
  .replying-info b{ color:var(--accent-2); font-size:11.5px; font-family:'JetBrains Mono',monospace; }
  .replying-info span{ color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px; }
  .replying-cancel{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px; padding:0 6px; }

  /* ---------- WARNING BAR ---------- */
  .warning-bar{
    display:none; align-items:center; gap:8px; padding:9px 14px; background:rgba(255,107,107,0.12);
    border-top:1px solid rgba(255,107,107,0.3); font-size:12px; color:var(--danger); flex-shrink:0;
  }
  .warning-bar.open{ display:flex; animation:dropIn 0.15s ease; }

  /* ---------- INPUT AREA ---------- */
  .input-area{ border-top:1px solid var(--border); background:var(--bg-1); padding:10px 12px 14px; position:relative; flex-shrink:0; }
  .input-row{ display:flex; align-items:flex-end; gap:8px; }
  .input-box{
    flex:1; display:flex; align-items:center; background:var(--surface); border:1.5px solid var(--border);
    border-radius:22px; padding:6px 6px 6px 16px; gap:6px; transition:border-color 0.15s;
  }
  .input-box:focus-within{ border-color:var(--accent); }
  .text-input{
    flex:1; border:none; outline:none; background:none; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
    padding:8px 0; max-height:90px; resize:none;
  }
  .input-tool{ width:34px; height:34px; border-radius:50%; border:none; background:none; color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:color 0.15s, background 0.15s;}
  .input-tool:hover{ background:var(--surface-2); color:var(--accent); }
  .send-btn{
    width:42px; height:42px; border-radius:50%; border:none; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 0.15s, opacity 0.2s; box-shadow:0 8px 20px -6px var(--accent);
  }
  .send-btn:active{ transform:scale(0.9); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }

  /* ---------- PICKERS (emoji / gif) ---------- */
  .picker-panel{
    position:absolute; bottom:100%; left:0; right:0; background:var(--bg-1); border-top:1px solid var(--border);
    max-height:0; overflow:hidden; transition:max-height 0.25s ease; z-index:30;
  }
  .picker-panel.open{ max-height:230px; }
  .picker-tabs{ display:flex; gap:6px; padding:8px 12px 0; }
  .picker-tab{ font-size:12px; padding:6px 12px; border-radius:14px; background:var(--surface); color:var(--text-muted); border:1px solid var(--border); cursor:pointer; font-family:'Sora',sans-serif; font-weight:600;}
  .picker-tab.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .emoji-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:2px; padding:10px 12px; overflow-y:auto; max-height:180px; }
  .emoji-cell{ font-size:20px; background:none; border:none; cursor:pointer; border-radius:8px; padding:6px 0; transition:background 0.12s;}
  .emoji-cell:hover{ background:var(--surface-2); }
  .gif-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:10px 12px; overflow-y:auto; max-height:180px; }
  .gif-cell{ border-radius:10px; overflow:hidden; cursor:pointer; border:1px solid var(--border); aspect-ratio:1; background:var(--surface); }
  .gif-cell img{ width:100%; height:100%; object-fit:cover; display:block; }

  .empty-state{ margin:auto; text-align:center; color:var(--text-muted); font-size:13px; padding:40px; }
  .toast{
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface);
    border:1px solid var(--border); padding:9px 16px; border-radius:20px; font-size:12.5px; color:var(--text);
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; z-index:100;
    max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-glow"></div>
    <div class="login-mark">S</div>
    <div class="login-title">SideTalkk</div>
    <div class="login-sub">Pick a unique username to jump into the conversation. No password, no setup.</div>
    <form class="login-form" id="loginForm">
      <input class="login-input" id="usernameInput" type="text" placeholder="Your username" maxlength="20" autocomplete="off" required>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" id="loginBtn" type="submit">
        <span id="loginBtnText">Enter chat</span>
        <span class="spinner" id="loginSpinner"></span>
      </button>
    </form>
    <div class="login-hint">Your session stays open on this device until you log out.</div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen" style="display:none; flex-direction:column; flex:1; min-height:0;">
    <div class="header">
      <div class="header-user">
        <div class="avatar" id="myAvatar">?</div>
        <div>
          <div class="header-name" id="myName">—</div>
          <div class="header-status"><span class="dot"></span> Live</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle theme"></button>
        <button class="icon-btn" id="menuBtn" title="Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="19" r="1.4"></circle></svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <button class="settings-item" id="themeMenuItem">Switch theme</button>
          <button class="settings-item danger" id="logoutBtn">Log out</button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">No messages yet — say something to start the conversation.</div>
    </div>

    <div class="replying-bar" id="replyingBar">
      <div class="replying-info">
        <b id="replyingToName"></b>
        <span id="replyingToText"></span>
      </div>
      <button class="replying-cancel" id="cancelReply">&times;</button>
    </div>

    <div class="warning-bar" id="warningBar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
      <span id="warningText">That message isn't allowed. Please rephrase it.</span>
    </div>

    <div class="input-area">
      <div class="picker-panel" id="pickerPanel">
        <div class="picker-tabs">
          <div class="picker-tab active" data-tab="emoji" id="tabEmoji">Emoji</div>
          <div class="picker-tab" data-tab="gif" id="tabGif">GIFs</div>
        </div>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="gif-grid hidden" id="gifGrid"></div>
      </div>
      <div class="input-row">
        <button class="input-tool" id="emojiBtn" title="Emoji">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"></path><circle cx="9" cy="9.5" r="1" fill="currentColor"></circle><circle cx="15" cy="9.5" r="1" fill="currentColor"></circle></svg>
        </button>
        <button class="input-tool" id="gifBtn" title="GIF">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 10v4M10 10v4M10 12h1.5M14 10v4h2M17 10v4M17 12h1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <div class="input-box">
          <textarea class="text-input" id="textInput" rows="1" placeholder="Message"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>

  /* =========================================================
     3. CONTENT MODERATION FILTER
     ========================================================= */
  const BAD_WORDS = ["damn","hell","crap","shit","fuck","bitch","asshole","bastard","dick","piss"];

  const LEET_MAP = {
    "0":"o","1":"i","!":"i","3":"e","4":"a","@":"a","5":"s","$":"s",
    "7":"t","+":"t","8":"b","9":"g","|":"i"
  };

  function normalizeForFilter(str){
    let s = (str || "").toLowerCase();
    s = s.split("").map(ch => LEET_MAP[ch] !== undefined ? LEET_MAP[ch] : ch).join("");
    s = s.replace(/[^a-z]/g, "");
    s = s.replace(/(.)\1{2,}/g, "$1$1");
    return s;
  }

  function containsProfanity(raw){
    const normalized = normalizeForFilter(raw);
    if(!normalized) return false;
    return BAD_WORDS.some(word => normalized.includes(word));
  }

  /* =========================================================

     ========================================================= */
  const loginScreen   = document.getElementById("loginScreen");

  const messagesEl    = document.getElementById("messages");

  const textInput     = document.getElementById("textInput");
  const sendBtn       = document.getElementById("sendBtn");
  const emojiBtn      = document.getElementById("emojiBtn");
  const gifBtn        = document.getElementById("gifBtn");
  const pickerPanel   = document.getElementById("pickerPanel");
  const emojiGrid     = document.getElementById("emojiGrid");

  const tabEmoji      = document.getElementById("tabEmoji");

  const replyingBar   = document.getElementById("replyingBar");
  const replyingToName= document.getElementById("replyingToName");
  const replyingToText= document.getElementById("replyingToText");
  const cancelReplyBtn= document.getElementById("cancelReply");
  const warningBar    = document.getElementById("warningBar");
  const warningText   = document.getElementById("warningText");
  const menuBtn       = document.getElementById("menuBtn");
  const settingsMenu  = document.getElementById("settingsMenu");
  const logoutBtn     = document.getElementById("logoutBtn");
  const themeToggleBtn= document.getElementById("themeToggleBtn");
  const themeMenuItem = document.getElementById("themeMenuItem");
  const toastEl       = document.getElementById("toast");

  /* =========================================================
     5. THEME SYSTEM
     ========================================================= */
  const savedTheme = localStorage.getItem(LS_THEME_KEY) || "dark";
  function setTheme(theme){
    if(theme === "accent"){
      document.documentElement.setAttribute("data-theme", "accent");
      themeToggleBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>';
      themeMenuItem.textContent = "Dark theme";
    } else {
      document.documentElement.removeAttribute("data-theme");
      themeToggleBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
      themeMenuItem.textContent = "Light theme";
    }
    localStorage.setItem(LS_THEME_KEY, theme);
  }
  setTheme(savedTheme);

  function toggleTheme(){
    const current = localStorage.getItem(LS_THEME_KEY) || "dark";
    setTheme(current === "dark" ? "accent" : "dark");
  }

  themeToggleBtn.addEventListener("click", toggleTheme);
  themeMenuItem.addEventListener("click", () => {
    toggleTheme();
    settingsMenu.classList.remove("open");
  });

  /* =========================================================
     6. SESSION & LOGIN
     ========================================================= */
  try {
    const hiddenStored = localStorage.getItem(LS_HIDDEN_KEY);
    if(hiddenStored) hiddenMsgIds = new Set(JSON.parse(hiddenStored));
  } catch(e){}

  function showToast(msg, duration = 2200){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), duration);
  }

  sessionId = localStorage.getItem(LS_SESSION_KEY);
  if(!sessionId){
    sessionId = 'sess_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    localStorage.setItem(LS_SESSION_KEY, sessionId);
  }

  const storedUser = localStorage.getItem(LS_USER_KEY);
  if(storedUser){
    currentUser = storedUser;
    initChat();
  } else {
    loginScreen.style.display = "flex";
    chatScreen.style.display = "none";
    setTimeout(() => usernameInput.focus(), 100);
  }

  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const rawName = usernameInput.value.trim();
    loginError.classList.remove("show");
    usernameInput.classList.remove("error");

    if(!rawName){
      loginError.textContent = "Please enter a username.";
      loginError.classList.add("show");
      usernameInput.classList.add("error");
      return;
    }
    if(rawName.length < 2){
      loginError.textContent = "Username must be at least 2 characters.";
      loginError.classList.add("show");
      usernameInput.classList.add("error");
      return;
    }
    if(containsProfanity(rawName)){
      loginError.textContent = "That username is not allowed.";
      loginError.classList.add("show");
      usernameInput.classList.add("error");
      return;
    }

    loginBtn.disabled = true;
    loginBtnText.textContent = "Connecting...";
    loginSpinner.classList.add("show");

    usersRef.child(rawName).once("value", (snapshot) => {
      const data = snapshot.val();
      const now = Date.now();
      if(data && data.sessionId !== sessionId && (now - data.lastSeen < 180000)){
        loginBtn.disabled = false;
        loginBtnText.textContent = "Enter chat";
        loginSpinner.classList.remove("show");
        loginError.textContent = "Username is already in use by someone else right now.";
        loginError.classList.add("show");
        usernameInput.classList.add("error");
        return;
      }

      usersRef.child(rawName).set({ sessionId: sessionId, lastSeen: now }).then(() => {
        currentUser = rawName;
        localStorage.setItem(LS_USER_KEY, currentUser);
        loginScreen.style.display = "none";
        chatScreen.style.display = "flex";
        initChat();
      }).catch((err) => {
        loginBtn.disabled = false;
        loginBtnText.textContent = "Enter chat";
        loginSpinner.classList.remove("show");
        loginError.textContent = "Connection error. Please try again.";
        loginError.classList.add("show");
      });
    });
  });

  logoutBtn.addEventListener("click", () => {
    localStorage.removeItem(LS_USER_KEY);

  menuBtn.addEventListener("click", (e) => {

    settingsMenu.classList.toggle("open");
  });
  document.addEventListener("click", () => {
    settingsMenu.classList.remove("open");
  });

  /* =========================================================
     7. CHAT LOGIC & RENDERING
     ========================================================= */
  function initChat(){
    myName.textContent = currentUser;
    myAvatar.textContent = currentUser.charAt(0).toUpperCase();

    setInterval(() => {
      if(currentUser){
        usersRef.child(currentUser).update({ lastSeen: firebase.database.ServerValue.TIMESTAMP, sessionId: sessionId });
      }
    }, 45000);

    populateEmojiGrid();
    populateGifGrid();

    messagesRef.on("value", (snapshot) => {
      const rawData = snapshot.val() || {};
      messagesCache = rawData;
      renderMessages(rawData);
    });
  }

  function formatTime(ts){
    if(!ts) return "";
    const d = new Date(ts);
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2, "0");
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return `${h}:${m} ${ampm}`;
  }

  function formatDateDivider(ts){
    const d = new Date(ts);
    const today = new Date();
    if(d.toDateString() === today.toDateString()) return "Today";
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if(d.toDateString() === yesterday.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderMessages(data){
    messagesEl.innerHTML = "";
    const keys = Object.keys(data);
    if(keys.length === 0){
      emptyState.style.display = "block";
      messagesEl.appendChild(emptyState);
      return;
    }
    emptyState.style.display = "none";

    keys.sort((a, b) => (data[a].timestamp || 0) - (data[b].timestamp || 0));

    let lastDateStr = "";
    let renderedCount = 0;

    keys.forEach(key => {
      const msg = data[key];
      if(!msg || hiddenMsgIds.has(key)) return;

      if(msg.timestamp){
        const dStr = new Date(msg.timestamp).toDateString();
        if(dStr !== lastDateStr){
          lastDateStr = dStr;
          const div = document.createElement("div");
          div.className = "day-divider";
          div.textContent = formatDateDivider(msg.timestamp);
          messagesEl.appendChild(div);
        }
      }

      renderedCount++;
      const isMe = msg.sender === currentUser;
      const row = document.createElement("div");
      row.className = `msg-row ${isMe ? "me" : "them"}`;
      row.setAttribute("data-id", key);

      if(!isMe){
        const senderEl = document.createElement("div");
        senderEl.className = "msg-sender";
        senderEl.textContent = msg.sender;
        row.appendChild(senderEl);
      }

      const bubbleWrap = document.createElement("div");
      bubbleWrap.className = "bubble-wrap";

      const quickBar = document.createElement("div");
      quickBar.className = "quick-bar";
      QUICK_EMOJIS.forEach(emo => {
        const qBtn = document.createElement("button");
        qBtn.className = "quick-emoji";
        qBtn.textContent = emo;
        qBtn.title = emo;
        qBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleReaction(key, emo);
          bubbleWrap.classList.remove("active");
        });
        quickBar.appendChild(qBtn);
      });
      const moreBtn = document.createElement("button");
      moreBtn.className = "quick-more";
      moreBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="12" cy="19" r="1.2"></circle></svg>';
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleContext(bubbleWrap, key);
      });
      quickBar.appendChild(moreBtn);
      bubbleWrap.appendChild(quickBar);

      const ctxMenu = document.createElement("div");
      ctxMenu.className = "msg-context";
      
      const replyCtx = document.createElement("button");
      replyCtx.className = "ctx-item";
      replyCtx.textContent = "Reply";
      replyCtx.addEventListener("click", (e) => {
        e.stopPropagation();
        ctxMenu.classList.remove("open");
        bubbleWrap.classList.remove("active");
        setReplyingTo(key, msg);
      });
      ctxMenu.appendChild(replyCtx);

      if(msg.type === "text" && !msg.unsent){
        const copyCtx = document.createElement("button");
        copyCtx.className = "ctx-item";
        copyCtx.textContent = "Copy text";
        copyCtx.addEventListener("click", (e) => {
          e.stopPropagation();
          ctxMenu.classList.remove("open");
          bubbleWrap.classList.remove("active");
          navigator.clipboard.writeText(msg.text || "").then(() => showToast("Copied to clipboard"));
        });
        ctxMenu.appendChild(copyCtx);
      }

      if(isMe && !msg.unsent && (Date.now() - (msg.timestamp || 0) < UNSEND_WINDOW_MS)){
        const unsendCtx = document.createElement("button");
        unsendCtx.className = "ctx-item danger";
        unsendCtx.textContent = "Unsend";
        unsendCtx.addEventListener("click", (e) => {
          e.stopPropagation();
          ctxMenu.classList.remove("open");
          bubbleWrap.classList.remove("active");
          messagesRef.child(key).update({ unsent: true, text: "This message was unsent.", type: "text", mediaUrl: null, replyTo: null });
        });
        ctxMenu.appendChild(unsendCtx);
      }

      const delMeCtx = document.createElement("button");
      delMeCtx.className = "ctx-item danger";
      delMeCtx.textContent = "Delete for me";
      delMeCtx.addEventListener("click", (e) => {
        e.stopPropagation();
        ctxMenu.classList.remove("open");
        bubbleWrap.classList.remove("active");
        hiddenMsgIds.add(key);
        try { localStorage.setItem(LS_HIDDEN_KEY, JSON.stringify([...hiddenMsgIds])); } catch(err){}
        renderMessages(messagesCache);
      });
      ctxMenu.appendChild(delMeCtx);
      bubbleWrap.appendChild(ctxMenu);

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if(msg.unsent) bubble.classList.add("unsent");

      if(msg.replyTo && data[msg.replyTo] && !msg.unsent){
        const repData = data[msg.replyTo];
        const rp = document.createElement("div");
        rp.className = "reply-preview";
        rp.addEventListener("click", (e) => {
          e.stopPropagation();
          const targetEl = messagesEl.querySelector(`[data-id="${msg.replyTo}"]`);
          if(targetEl){
            targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
            targetEl.style.transition = "background 0.3s";
            targetEl.style.filter = "brightness(1.2)";
            setTimeout(() => targetEl.style.filter = "", 800);
          }
        });
        const rpSender = document.createElement("span");
        rpSender.className = "rp-sender";
        rpSender.textContent = repData.sender;
        rp.appendChild(rpSender);

        const rpText = document.createElement("span");
        rpText.className = "rp-text";
        rpText.textContent = repData.unsent ? "This message was unsent." : (repData.type === "gif" ? "[GIF]" : (repData.text || ""));
        rp.appendChild(rpText);
        bubble.appendChild(rp);
      }

      if(msg.type === "gif" && msg.mediaUrl && !msg.unsent){
        const img = document.createElement("img");
        img.className = "msg-media";
        img.src = msg.mediaUrl;
        img.alt = "GIF";
        bubble.appendChild(img);
      } else {
        const p = document.createElement("p");
        p.className = "msg-text";
        p.textContent = msg.text || "";
        bubble.appendChild(p);
      }

      bubble.addEventListener("click", () => {
        const wasActive = bubbleWrap.classList.contains("active");
        document.querySelectorAll(".bubble-wrap.active").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".msg-context.open").forEach(el => el.classList.remove("open"));
        if(!wasActive) bubbleWrap.classList.add("active");
      });

      bubbleWrap.appendChild(bubble);
      row.appendChild(bubbleWrap);

      if(msg.reactions && !msg.unsent){
        const reactRow = document.createElement("div");
        reactRow.className = "reactions-row";
        Object.keys(msg.reactions).forEach(emoji => {
          const usersMap = msg.reactions[emoji];
          const uNames = Object.keys(usersMap || {});
          if(uNames.length > 0){
            const pill = document.createElement("div");
            pill.className = "reaction-pill";
            if(usersMap[currentUser]) pill.classList.add("mine");
            pill.textContent = `${emoji} ${uNames.length}`;
            pill.addEventListener("click", () => toggleReaction(key, emoji));
            reactRow.appendChild(pill);
          }
        });
        row.appendChild(reactRow);
      }

      const meta = document.createElement("div");
      meta.className = "msg-meta";
      const timeEl = document.createElement("div");
      timeEl.className = "msg-time";
      timeEl.textContent = formatTime(msg.timestamp);
      meta.appendChild(timeEl);
      row.appendChild(meta);

      messagesEl.appendChild(row);
    });

    if(renderedCount > 0){
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  messagesEl.addEventListener("click", (e) => {
    if(e.target === messagesEl){
      document.querySelectorAll(".bubble-wrap.active").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".msg-context.open").forEach(el => el.classList.remove("open"));
      pickerPanel.classList.remove("open");
    }
  });

  function toggleContext(bubbleWrap, key){
    const ctx = bubbleWrap.querySelector(".msg-context");
    const isOpen = ctx.classList.contains("open");
    document.querySelectorAll(".msg-context.open").forEach(el => el.classList.remove("open"));
    if(!isOpen) ctx.classList.add("open");
  }

  function toggleReaction(msgId, emoji){
    const ref = messagesRef.child(`${msgId}/reactions/${emoji}/${currentUser}`);
    ref.once("value", (snap) => {
      if(snap.exists()){
        ref.remove();
      } else {
        ref.set(true);
      }
    });
  }

  function setReplyingTo(key, msg){
    replyingTo = { id: key, sender: msg.sender, text: msg.unsent ? "This message was unsent." : (msg.type === "gif" ? "[GIF]" : (msg.text || "")) };
    replyingToName.textContent = `Replying to ${msg.sender}`;
    replyingToText.textContent = replyingTo.text;
    replyingBar.classList.add("open");
    textInput.focus();
  }

  cancelReplyBtn.addEventListener("click", () => {
    replyingTo = null;
    replyingBar.classList.remove("open");
  });

  /* =========================================================
     8. SENDING & INPUT
     ========================================================= */
  textInput.addEventListener("input", () => {
    sendBtn.disabled = !textInput.value.trim();
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 90) + "px";
  });

  textInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      if(!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener("click", () => {
    if(!sendBtn.disabled) sendMessage();
  });

  function sendMessage(mediaUrl = null, type = "text"){
    const rawText = textInput.value.trim();
    if(type === "text" && !rawText && !mediaUrl) return;

    if(type === "text" && rawText && containsProfanity(rawText)){
      warningBar.classList.add("open");
      setTimeout(() => warningBar.classList.remove("open"), 4000);
      return;
    }

    warningBar.classList.remove("open");

    const msgData = {
      sender: currentUser,
      type: type,
      text: type === "text" ? rawText : "",
      mediaUrl: mediaUrl,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    };

    if(replyingTo){
      msgData.replyTo = replyingTo.id;
    }

    messagesRef.push(msgData).then(() => {
      textInput.value = "";
      textInput.style.height = "auto";
      sendBtn.disabled = true;
      replyingTo = null;
      replyingBar.classList.remove("open");
      pickerPanel.classList.remove("open");
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }).catch(err => {
      showToast("Failed to send message");
    });
  }

  /* =========================================================
     9. PICKERS (Emoji & GIF)
     ========================================================= */
  function populateEmojiGrid(){
    emojiGrid.innerHTML = "";
    EMOJI_LIST.forEach(em => {
      const btn = document.createElement("button");
      btn.className = "emoji-cell";
      btn.textContent = em;
      btn.addEventListener("click", () => {
        textInput.value += em;
        sendBtn.disabled = !textInput.value.trim();
        textInput.focus();
      });
      emojiGrid.appendChild(btn);
    });
  }

  function populateGifGrid(){
    gifGrid.innerHTML = "";
    presetGIFs.forEach(url => {
      const cell = document.createElement("div");
      cell.className = "gif-cell";
      const img = document.createElement("img");
      img.src = url;
      img.alt = "GIF";
      cell.appendChild(img);
      cell.addEventListener("click", () => {
        sendMessage(url, "gif");
      });
      gifGrid.appendChild(cell);
    });
  }

  emojiBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    gifGrid.classList.add("hidden");
    emojiGrid.classList.remove("hidden");
    tabEmoji.classList.add("active");
    tabGif.classList.remove("active");
    pickerPanel.classList.toggle("open");
  });

  gifBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    emojiGrid.classList.add("hidden");
    gifGrid.classList.remove("hidden");
    tabGif.classList.add("active");
    tabEmoji.classList.remove("active");
    pickerPanel.classList.toggle("open");
  });

  tabEmoji.addEventListener("click", () => {
    gifGrid.classList.add("hidden");
    emojiGrid.classList.remove("hidden");
    tabEmoji.classList.add("active");
    tabGif.classList.remove("active");
  });

  tabGif.addEventListener("click", () => {
    emojiGrid.classList.add("hidden");
    gifGrid.classList.remove("hidden");
    tabGif.classList.add("active");
    tabEmoji.classList.remove("active");
  });

  document.addEventListener("click", (e) => {
    if(!pickerPanel.contains(e.target) && e.target !== emojiBtn && e.target !== gifBtn){
      pickerPanel.classList.remove("open");
    }
  });

})();
</script>
</body>
</html>
