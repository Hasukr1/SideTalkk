<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideTalkk</title>
  <!-- Supabase JS Library & Crypto-JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --sent: #3b82f6;
      --recv: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%, #020617 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      position: relative;
    }

    /* Floating Auth Popup Modal (Compact, Non-Fullscreen) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-card h3 { text-align: center; font-size: 1.2rem; }
    .modal-close { position: absolute; top: 12px; right: 14px; background: none; border: none; color: var(--subtext); cursor: pointer; font-size: 1.2rem; }

    /* Inputs & Buttons */
    .auth-input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .auth-input:focus { border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }

    .auth-switch {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }
    .auth-switch:hover { color: var(--text); text-decoration: underline; }

    /* Main Chat Container */
    .chat-card {
      width: 90%;
      max-width: 650px;
      height: 82vh;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* Header Bar */
    .header {
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand h2 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-tag {
      font-size: 0.85rem;
      color: var(--subtext);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn-sm {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sm:hover { background: var(--accent-hover); }

    /* Chat Messages Area */
    .messages-container {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 80%;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-group.sent { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }

    .msg-body { display: flex; flex-direction: column; gap: 2px; }
    .sent .msg-body { align-items: flex-end; }

    .msg-meta { font-size: 0.725rem; color: var(--subtext); display: flex; gap: 6px; }

    .reply-preview-bubble {
      font-size: 0.775rem;
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
      color: #cbd5e1;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .received .bubble { background: var(--recv); border-top-left-radius: 2px; border: 1px solid var(--border); }
    .sent .bubble { background: var(--sent); border-top-right-radius: 2px; color: #fff; }

    .reply-btn {
      font-size: 0.675rem;
      color: var(--subtext);
      cursor: pointer;
      margin-top: 1px;
    }
    .reply-btn:hover { color: var(--text); }

    .active-reply-bar {
      background: #0f172a;
      border-top: 1px solid var(--border);
      padding: 8px 20px;
      font-size: 0.8rem;
      color: var(--subtext);
      display: none;
      justify-content: space-between;
      align-items: center;
    }
    .active-reply-bar button { background: none; border: none; color: #ef4444; cursor: pointer; }

    /* Footer Input */
    .footer {
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.8);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      position: relative;
    }

    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }

    .chat-input:focus { border-color: var(--accent); }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 4px;
    }

    .emoji-picker {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .emoji-picker span {
      font-size: 1.3rem;
      cursor: pointer;
      text-align: center;
      padding: 2px;
      border-radius: 6px;
    }
    .emoji-picker span:hover { background: rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>

  <!-- COMPACT MODAL POPUP (HIDDEN BY DEFAULT) -->
  <div class="modal-backdrop" id="authModal">
    
    <!-- LOGIN BOX -->
    <div class="modal-card" id="loginBox">
      <button type="button" class="modal-close" onclick="closeAuthModal()">✕</button>
      <h3>Sign In</h3>
      <input type="text" id="loginUser" class="auth-input" placeholder="Username" autocomplete="off">
      <input type="password" id="loginPass" class="auth-input" placeholder="Password" autocomplete="off">
      <button type="button" class="btn" id="btnLogin">Log In</button>
      <button type="button" class="auth-switch" id="toRegisterBtn">Need an account? Register</button>
    </div>

    <!-- REGISTER BOX -->
    <div class="modal-card" id="regBox" style="display: none;">
      <button type="button" class="modal-close" onclick="closeAuthModal()">✕</button>
      <h3>Create Account</h3>
      <input type="text" id="regUser" class="auth-input" placeholder="Username" autocomplete="off">
      <input type="password" id="regPass" class="auth-input" placeholder="Password" autocomplete="off">
      <button type="button" class="btn" id="btnReg">Register</button>
      <button type="button" class="auth-switch" id="toLoginBtn">Already have an account? Log In</button>
    </div>

  </div>

  <!-- CHAT UI -->
  <div class="chat-card">
    <div class="header">
      <div class="brand">
        <h2>SideTalkk</h2>
      </div>
      <div class="header-actions">
        <span class="user-tag" id="userTag">Guest</span>
        <button type="button" class="btn-sm" id="authNavBtn" onclick="openAuthModal()">Sign In</button>
      </div>
    </div>

    <div class="messages-container" id="chatBox"></div>

    <div class="active-reply-bar" id="replyBar">
      <span id="replyText">Replying to...</span>
      <button type="button" onclick="cancelReply()">✕</button>
    </div>

    <div class="emoji-picker" id="emojiPicker">
      <span>😀</span><span>😂</span><span>🔥</span><span>❤️</span><span>👍</span>
      <span>😎</span><span>💀</span><span>🎉</span><span>😭</span><span>✨</span>
    </div>

    <div class="footer">
      <button type="button" class="emoji-btn" id="emojiToggle">😊</button>
      <input type="text" id="msgInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
      <button type="button" class="btn" id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tuaqfedssagapneldepn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_crXYWwNe4TRDJKxEM7Cuvw_cJS-20Vz";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = localStorage.getItem('st_user') || 'Guest_' + Math.floor(100 + Math.random() * 900);
    let isLoggedIn = localStorage.getItem('st_logged_in') === 'true';
    let selectedReply = null;

    updateUserDisplay();
    loadHistory();
    listenRealtime();

    function updateUserDisplay() {
      const userTag = document.getElementById('userTag');
      const authBtn = document.getElementById('authNavBtn');

      userTag.innerText = currentUser;
      if (isLoggedIn) {
        authBtn.innerText = "Logout";
        authBtn.onclick = logout;
      } else {
        authBtn.innerText = "Sign In";
        authBtn.onclick = openAuthModal;
      }
    }

    function openAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    document.getElementById('toRegisterBtn').addEventListener('click', () => {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('regBox').style.display = 'flex';
    });

    document.getElementById('toLoginBtn').addEventListener('click', () => {
      document.getElementById('regBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'flex';
    });

    function hash(text) {
      return CryptoJS.SHA256(text).toString();
    }

    // REGISTER
    document.getElementById('btnReg').addEventListener('click', async () => {
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      if (!user || !pass) return alert("Fill in both fields!");

      const { data: existing } = await supabase.from('users').select('username').eq('username', user).single();

      if (existing) {
        alert("Username already taken!");
      } else {
        const { error } = await supabase.from('users').insert([{ username: user, password: hash(pass) }]);
        if (error) return alert("Error registering account!");
        alert("Account created!");
        loginUser(user);
      }
    });

    // LOGIN
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (!user || !pass) return alert("Fill in username and password!");

      const { data: foundUser } = await supabase.from('users').select('*').eq('username', user).single();

      if (foundUser && foundUser.password === hash(pass)) {
        loginUser(user);
      } else {
        alert("Invalid username or password!");
      }
    });

    function loginUser(user) {
      currentUser = user;
      isLoggedIn = true;
      localStorage.setItem('st_user', user);
      localStorage.setItem('st_logged_in', 'true');
      closeAuthModal();
      updateUserDisplay();
      loadHistory();
    }

    function logout() {
      localStorage.removeItem('st_user');
      localStorage.removeItem('st_logged_in');
      currentUser = 'Guest_' + Math.floor(100 + Math.random() * 900);
      isLoggedIn = false;
      updateUserDisplay();
    }

    // EMOJI TOGGLE
    const emojiPicker = document.getElementById('emojiPicker');
    document.getElementById('emojiToggle').onclick = () => {
      emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
    };

    document.querySelectorAll('.emoji-picker span').forEach(el => {
      el.onclick = () => {
        document.getElementById('msgInput').value += el.innerText;
        emojiPicker.style.display = 'none';
      };
    });

    // REPLY SYSTEM
    function startReply(user, text) {
      selectedReply = { user, text };
      document.getElementById('replyBar').style.display = 'flex';
      document.getElementById('replyText').innerText = `Replying to ${user}: "${text.substring(0, 25)}..."`;
    }

    function cancelReply() {
      selectedReply = null;
      document.getElementById('replyBar').style.display = 'none';
    }

    // SEND MESSAGE
    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        username: currentUser,
        text: text,
        reply_user: selectedReply ? selectedReply.user : null,
        reply_text: selectedReply ? selectedReply.text : null
      };

      input.value = '';
      cancelReply();

      try {
        await supabase.from('messages').insert([payload]);
      } catch (err) {
        console.error("Failed to send message:", err);
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // RENDER MESSAGE
    function renderMessage(msg) {
      const isMe = msg.username === currentUser;
      const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const replyHTML = msg.reply_user ? `<div class="reply-preview-bubble"><strong>${msg.reply_user}:</strong> ${msg.reply_text}</div>` : '';

      const msgHTML = `
        <div class="msg-group ${isMe ? 'sent' : 'received'}">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${msg.username}" class="msg-avatar">
          <div class="msg-body">
            <div class="msg-meta">
              <span>${msg.username}</span>
              <span>${timeStr}</span>
            </div>
            <div class="bubble">
              ${replyHTML}
              ${msg.text}
            </div>
            <div class="reply-btn" onclick="startReply('${msg.username}', '${msg.text.replace(/'/g, "\\'")}')">↩ Reply</div>
          </div>
        </div>
      `;

      const chatBox = document.getElementById('chatBox');
      chatBox.insertAdjacentHTML('beforeend', msgHTML);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // LOAD HISTORY
    async function loadHistory() {
      const { data: messages } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
      if (messages) {
        document.getElementById('chatBox').innerHTML = '';
        messages.forEach(renderMessage);
      }
    }

    // REALTIME LISTEN
    function listenRealtime() {
      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }
  </script>
</body>
</html>
