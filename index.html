<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SideTalkk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0e14;
    --bg-1:#0f1420;
    --surface:#131826;
    --surface-2:#1a2032;
    --border:#232a3d;
    --text:#e8eaf0;
    --text-muted:#8890a6;
    --accent:#7c5cfc;
    --accent-2:#31e1f2;
    --accent-soft:rgba(124,92,252,0.16);
    --pink:#ff5c8a;
    --danger:#ff6b6b;
    --bubble-me:#2a2452;
    --bubble-them:#171d2c;
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow-frame: 0 40px 90px -20px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.03);
  }
  html[data-theme="accent"]{
    --bg-0:#eef0fa;
    --bg-1:#f5f6fc;
    --surface:#ffffff;
    --surface-2:#f1f2fb;
    --border:#e3e6f5;
    --text:#1b1f2a;
    --text-muted:#767d95;
    --accent:#6d4fe0;
    --accent-2:#00b6c9;
    --accent-soft:rgba(109,79,224,0.10);
    --bubble-me:#e9e4ff;
    --bubble-them:#f4f5fb;
    --shadow-frame: 0 40px 90px -24px rgba(76,66,140,0.35), 0 0 0 1px rgba(0,0,0,0.03);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(124,92,252,0.25), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(49,225,242,0.16), transparent 45%),
      var(--bg-0);
    background-attachment:fixed;
    transition: background 0.4s ease;
    padding:24px;
  }
  .phone{
    width:420px; max-width:100%; height:850px; max-height:94vh;
    background:var(--bg-1);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-frame);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    border:1px solid var(--border);
  }
  .notch{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:122px; height:22px; background:var(--bg-0); border-radius:20px; z-index:50;
    opacity:0.9;
  }

  /* ---------- LOGIN SCREEN ---------- */
  .login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:40px 32px; text-align:center; position:relative; overflow:hidden;
  }
  .login-glow{
    position:absolute; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:0.35; top:-90px; left:50%; transform:translateX(-50%); filter:blur(10px);
    animation: pulseGlow 5s ease-in-out infinite;
  }
  @keyframes pulseGlow{ 0%,100%{opacity:0.25; transform:translateX(-50%) scale(1);} 50%{opacity:0.45; transform:translateX(-50%) scale(1.08);} }
  .login-mark{
    width:64px; height:64px; border-radius:20px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:26px; color:#fff;
    z-index:2; box-shadow:0 12px 30px -8px var(--accent);
  }
  .login-title{ font-family:'Sora',sans-serif; font-weight:700; font-size:26px; color:var(--text); z-index:2; letter-spacing:-0.02em;}
  .login-sub{ font-size:14px; color:var(--text-muted); z-index:2; max-width:290px; line-height:1.5;}
  .login-form{ width:100%; display:flex; flex-direction:column; gap:12px; z-index:2; margin-top:4px;}
  .login-input{
    width:100%; padding:16px 18px; border-radius:var(--radius-md); border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  }
  .login-input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .login-input.error{ border-color:var(--danger); }
  .login-error{
    font-size:12.5px; color:var(--danger); text-align:left; padding:0 4px; min-height:16px; z-index:2;
    display:none;
  }
  .login-error.show{ display:block; animation:dropIn 0.15s ease; }
  .login-btn{
    width:100%; padding:16px; border:none; border-radius:var(--radius-md);
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff; font-weight:700; font-size:15px; font-family:'Sora',sans-serif; cursor:pointer;
    transition:transform 0.15s, opacity 0.2s; letter-spacing:0.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .login-btn:active{ transform:scale(0.97); }
  .login-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .login-hint{ font-size:12px; color:var(--text-muted); z-index:2; }
  .spinner{
    width:15px; height:15px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
    animation:spin 0.7s linear infinite; display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- HEADER ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 20px 16px; border-bottom:1px solid var(--border);
    background:var(--bg-1); z-index:10;
  }
  .header-user{ display:flex; align-items:center; gap:11px; }
  .avatar{
    width:40px; height:40px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:700; color:#fff; font-size:15.5px;
    flex-shrink:0;
  }
  .header-name{ font-family:'Sora',sans-serif; font-weight:600; font-size:15px; color:var(--text); }
  .header-status{ font-size:11px; color:var(--accent-2); font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:5px;}
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent-2); box-shadow:0 0 6px var(--accent-2); }
  .header-actions{ display:flex; align-items:center; gap:8px; position:relative; }
  .icon-btn{
    width:36px; height:36px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text); transition:background 0.15s, transform 0.15s;
  }
  .icon-btn:hover{ background:var(--surface-2); }
  .icon-btn:active{ transform:scale(0.92); }
  .settings-menu{
    position:absolute; top:44px; right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:6px; width:170px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.5);
    display:none; flex-direction:column; z-index:60;
  }
  .settings-menu.open{ display:flex; animation:dropIn 0.16s ease; }
  @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .settings-item{
    padding:10px 12px; border-radius:8px; font-size:13.5px; color:var(--text); cursor:pointer;
    display:flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; background:none; border:none; text-align:left; width:100%;
  }
  .settings-item:hover{ background:var(--surface-2); }
  .settings-item.danger{ color:var(--danger); }

  /* ---------- MESSAGES ---------- */
  .messages{
    flex:1; min-width:0; width:100%; overflow-y:auto; overflow-x:hidden; padding:18px 16px 10px; display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  .messages::-webkit-scrollbar{ width:5px; }
  .messages::-webkit-scrollbar-track{ background:transparent; }
  .messages::-webkit-scrollbar-thumb{ background:var(--border); border-radius:10px; }

  .msg-row{ display:flex; flex-direction:column; max-width:80%; min-width:0; animation:msgIn 0.28s cubic-bezier(.2,.8,.2,1); position:relative; }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(10px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1);} }
  .msg-row.me{ align-self:flex-end; align-items:flex-end; }
  .msg-row.them{ align-self:flex-start; align-items:flex-start; }
  .msg-sender{ font-size:11px; color:var(--accent-2); font-family:'JetBrains Mono',monospace; margin:0 4px 4px; }

  .bubble-wrap{ position:relative; max-width:100%; min-width:0; }
  .bubble{
    padding:12px 16px; border-radius:var(--radius-md); font-size:14.5px; line-height:1.5; color:var(--text);
    max-width:100%; min-width:0; word-wrap:break-word; overflow-wrap:anywhere; word-break:break-word;
    position:relative; cursor:pointer; transition:filter 0.15s;
  }
  .msg-row.me .bubble{
    background:var(--bubble-me); border-bottom-right-radius:5px;
    box-shadow: inset 0 0 0 1px rgba(124,92,252,0.25);
  }
  .msg-row.them .bubble{ background:var(--bubble-them); border-bottom-left-radius:5px; border:1px solid var(--border); }
  .bubble.unsent{ font-style:italic; color:var(--text-muted); }
  .bubble img.msg-media{ max-width:min(230px, 100%); width:auto; height:auto; border-radius:12px; display:block; margin-top:6px; }
  .bubble .msg-text{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }

  .reply-preview{
    border-left:3px solid var(--accent); background:rgba(124,92,252,0.1); border-radius:8px;
    padding:5px 9px; margin-bottom:6px; font-size:12px; cursor:pointer;
  }
  .reply-preview .rp-sender{ color:var(--accent-2); font-weight:600; font-family:'JetBrains Mono',monospace; font-size:11px; }
  .reply-preview .rp-text{ color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; max-width:100%; }

  .msg-meta{ display:flex; align-items:center; gap:6px; margin-top:4px; padding:0 4px; }
  .msg-time{ font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; }
  .seen-by{ font-size:10px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; padding:0 4px; margin-top:2px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .reactions-row{ display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .reaction-pill{
    display:flex; align-items:center; gap:3px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:2px 8px; font-size:12px; cursor:pointer; transition:transform 0.12s, border-color 0.15s;
  }
  .reaction-pill.mine{ border-color:var(--accent); background:var(--accent-soft); }
  .reaction-pill:active{ transform:scale(0.92); }

  /* hover/quick action bar */
  .quick-bar{
    position:absolute; top:-38px; display:flex; gap:2px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:4px; box-shadow:0 10px 24px -8px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transform:translateY(6px) scale(0.9); transition:opacity 0.15s, transform 0.15s; z-index:40;
  }
  .msg-row.me .quick-bar{ right:0; }
  .msg-row.them .quick-bar{ left:0; }
  .bubble-wrap.active .quick-bar{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); }
  .quick-emoji{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; transition:transform 0.12s; background:none; border:none;}
  .quick-emoji:hover{ transform:scale(1.25); }
  .quick-more{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); background:none; border:none;}
  .quick-more:hover{ background:var(--surface-2); color:var(--text); }

  .msg-context{
    position:absolute; top:0; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:6px; width:168px; box-shadow:0 20px 40px -10px rgba(0,0,0,0.5); z-index:70; display:none; flex-direction:column;
  }
  .msg-row.me .msg-context{ right:0; }
  .msg-row.them .msg-context{ left:0; }
  .msg-context.open{ display:flex; animation:dropIn 0.15s ease; }
  .ctx-item{ padding:9px 10px; border-radius:8px; font-size:13px; color:var(--text); cursor:pointer; background:none; border:none; text-align:left; font-family:'Inter',sans-serif; }
  .ctx-item:hover{ background:var(--surface-2); }
  .ctx-item.danger{ color:var(--danger); }

  .day-divider{ align-self:center; font-size:11px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; background:var(--surface); padding:4px 12px; border-radius:20px; margin:6px 0; }

  /* ---------- REPLY BAR ---------- */
  .replying-bar{
    display:none; align-items:center; justify-content:space-between; padding:8px 14px; background:var(--surface-2);
    border-top:1px solid var(--border); font-size:12.5px;
  }
  .replying-bar.open{ display:flex; animation:dropIn 0.15s ease; }
  .replying-info{ display:flex; flex-direction:column; border-left:3px solid var(--accent); padding-left:8px; overflow:hidden; min-width:0; flex:1; }
  .replying-info b{ color:var(--accent-2); font-size:11.5px; font-family:'JetBrains Mono',monospace; }
  .replying-info span{ color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .replying-cancel{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px; padding:0 6px; }

  /* ---------- WARNING BAR ---------- */
  .warning-bar{
    display:none; align-items:center; gap:8px; padding:9px 14px; background:rgba(255,107,107,0.12);
    border-top:1px solid rgba(255,107,107,0.3); font-size:12px; color:var(--danger);
  }
  .warning-bar.open{ display:flex; animation:dropIn 0.15s ease; }

  /* ---------- INPUT AREA ---------- */
  .input-area{ border-top:1px solid var(--border); background:var(--bg-1); padding:12px 16px 18px; position:relative; }
  .input-row{ display:flex; align-items:flex-end; gap:10px; }
  .input-box{
    flex:1; min-width:0; display:flex; align-items:center; background:var(--surface); border:1.5px solid var(--border);
    border-radius:24px; padding:6px 6px 6px 18px; gap:6px; transition:border-color 0.15s;
  }
  .input-box:focus-within{ border-color:var(--accent); }
  .text-input{
    flex:1; border:none; outline:none; background:none; color:var(--text); font-size:14.5px; font-family:'Inter',sans-serif;
    padding:8px 0; max-height:90px; resize:none;
  }
  .input-tool{ width:36px; height:36px; border-radius:50%; border:none; background:none; color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:color 0.15s, background 0.15s;}
  .input-tool:hover{ background:var(--surface-2); color:var(--accent); }
  .send-btn{
    width:44px; height:44px; border-radius:50%; border:none; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 0.15s, opacity 0.2s; box-shadow:0 8px 20px -6px var(--accent);
  }
  .send-btn:active{ transform:scale(0.9); }
  .send-btn:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }

  /* ---------- PICKERS (emoji / gif) ---------- */
  .picker-panel{
    position:absolute; bottom:100%; left:0; right:0; background:var(--bg-1); border-top:1px solid var(--border);
    max-height:0; overflow:hidden; transition:max-height 0.25s ease; z-index:30;
  }
  .picker-panel.open{ max-height:230px; }
  .picker-tabs{ display:flex; gap:6px; padding:8px 12px 0; }
  .picker-tab{ font-size:12px; padding:6px 12px; border-radius:14px; background:var(--surface); color:var(--text-muted); border:1px solid var(--border); cursor:pointer; font-family:'Sora',sans-serif; font-weight:600;}
  .picker-tab.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .emoji-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:2px; padding:10px 12px; overflow-y:auto; max-height:180px; }
  .emoji-cell{ font-size:20px; background:none; border:none; cursor:pointer; border-radius:8px; padding:6px 0; transition:background 0.12s;}
  .emoji-cell:hover{ background:var(--surface-2); }
  .gif-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:10px 12px; overflow-y:auto; max-height:180px; }
  .gif-cell{ border-radius:10px; overflow:hidden; cursor:pointer; border:1px solid var(--border); aspect-ratio:1; background:var(--surface); }
  .gif-cell img{ width:100%; height:100%; object-fit:cover; display:block; }

  .empty-state{ margin:auto; text-align:center; color:var(--text-muted); font-size:13px; padding:40px; }
  .toast{
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface);
    border:1px solid var(--border); padding:9px 16px; border-radius:20px; font-size:12.5px; color:var(--text);
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; z-index:100;
    max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-glow"></div>
    <div class="login-mark">S</div>
    <div class="login-title">SideTalkk</div>
    <div class="login-sub">Pick a unique username to jump into the conversation. No password, no setup.</div>
    <form class="login-form" id="loginForm">
      <input class="login-input" id="usernameInput" type="text" placeholder="Your username" maxlength="20" autocomplete="off" required>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" id="loginBtn" type="submit">
        <span id="loginBtnText">Enter chat</span>
        <span class="spinner" id="loginSpinner"></span>
      </button>
    </form>
    <div class="login-hint">Your session stays open on this device until you log out.</div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chatScreen" style="display:none; flex-direction:column; flex:1; min-height:0; min-width:0;">
    <div class="header">
      <div class="header-user">
        <div class="avatar" id="myAvatar">?</div>
        <div>
          <div class="header-name" id="myName">—</div>
          <div class="header-status"><span class="dot"></span> Live</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggleBtn" title="Toggle theme"></button>
        <button class="icon-btn" id="menuBtn" title="Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="19" r="1.4"></circle></svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <button class="settings-item" id="themeMenuItem">Switch theme</button>
          <button class="settings-item danger" id="logoutBtn">Log out</button>
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">No messages yet — say something to start the conversation.</div>
    </div>

    <div class="replying-bar" id="replyingBar">
      <div class="replying-info">
        <b id="replyingToName"></b>
        <span id="replyingToText"></span>
      </div>
      <button class="replying-cancel" id="cancelReply">×</button>
    </div>

    <div class="warning-bar" id="warningBar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
      <span id="warningText">That message isn't allowed. Please rephrase it.</span>
    </div>

    <div class="input-area">
      <div class="picker-panel" id="pickerPanel">
        <div class="picker-tabs">
          <div class="picker-tab active" data-tab="emoji" id="tabEmoji">Emoji</div>
          <div class="picker-tab" data-tab="gif" id="tabGif">GIFs</div>
        </div>
        <div class="emoji-grid" id="emojiGrid"></div>
        <div class="gif-grid hidden" id="gifGrid"></div>
      </div>
      <div class="input-row">
        <button class="input-tool" id="emojiBtn" title="Emoji">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2" stroke-linecap="round"></path><circle cx="9" cy="9.5" r="1" fill="currentColor"></circle><circle cx="15" cy="9.5" r="1" fill="currentColor"></circle></svg>
        </button>
        <button class="input-tool" id="gifBtn" title="GIF">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 10v4M10 10v4M10 12h1.5M14 10v4h2M17 10v4M17 12h1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <div class="input-box">

  /* =========================================================
     3. CONTENT MODERATION FILTER
     ---------------------------------------------------------
     Starter word list — intentionally a small, mild seed list.
     For real slur/profanity coverage, plug in a maintained
     source instead of hardcoding one (e.g. an npm package like
     "bad-words"/"leo-profanity", a hosted moderation API such as
     Google's Perspective API, or your own moderated list loaded
     from Firebase so it can be updated without a redeploy).
     The normalization below is what actually blocks bypasses —
     the word list itself is just the input to it, so swapping
     in a bigger list is a one-line change (BAD_WORDS = [...]).
     ========================================================= */
  const BAD_WORDS = ["damn","hell","crap","shit","fuck","bitch","asshole","bastard","dick","piss"];

  const LEET_MAP = {
    "0":"o","1":"i","!":"i","3":"e","4":"a","@":"a","5":"s","$":"s",
    "7":"t","+":"t","8":"b","9":"g","|":"i"
  };

  function normalizeForFilter(str){
    let s = (str || "").toLowerCase();
    s = s.split("").map(ch => LEET_MAP[ch] !== undefined ? LEET_MAP[ch] : ch).join("");
    s = s.replace(/[^a-z]/g, "");           // strips spaces, punctuation, symbols (catches "s h i t", "s.h.i.t")
    s = s.replace(/(.)\1{2,}/g, "$1$1");    // collapses long letter runs ("shiiiit" -> "shiit") without merging real double letters
    return s;
  }

  function containsProfanity(raw){
    const normalized = normalizeForFilter(raw);
    if(!normalized) return false;
    return BAD_WORDS.some(word => normalized.includes(word));
  }

  /* =========================================================
     4. DOM REFS
     ========================================================= */
  const loginScreen   = document.getElementById("loginScreen");
  const chatScreen    = document.getElementById("chatScreen");
  const loginForm     = document.getElementById("loginForm");
  const usernameInput = document.getElementById("usernameInput");
  const loginError    = document.getElementById("loginError");
  const loginBtn      = document.getElementById("loginBtn");
  const loginBtnText  = document.getElementById("loginBtnText");
  const loginSpinner  = document.getElementById("loginSpinner");
  const myAvatar      = document.getElementById("myAvatar");
  const myName        = document.getElementById("myName");
  const messagesEl    = document.getElementById("messages");
  const emptyState    = document.getElementById("emptyState");
  const textInput     = document.getElementById("textInput");
  const sendBtn       = document.getElementById("sendBtn");
  const emojiBtn      = document.getElementById("emojiBtn");
  const gifBtn        = document.getElementById("gifBtn");
  const pickerPanel   = document.getElementById("pickerPanel");
  const emojiGrid     = document.getElementById("emojiGrid");
  const gifGrid       = document.getElementById("gifGrid");
  const tabEmoji      = document.getElementById("tabEmoji");
  const tabGif        = document.getElementById("tabGif");
  const replyingBar   = document.getElementById("replyingBar");
  const replyingToName= document.getElementById("replyingToName");
  const replyingToText= document.getElementById("replyingToText");
  const cancelReplyBtn= document.getElementById("cancelReply");
  const warningBar    = document.getElementById("warningBar");
  const warningText   = document.getElementById("warningText");
  const menuBtn       = document.getElementById("menuBtn");
  const settingsMenu  = document.getElementById("settingsMenu");
  const logoutBtn     = document.getElementById("logoutBtn");
  const themeToggleBtn= document.getElementById("themeToggleBtn");
  const themeMenuItem = document.getElementById("themeMenuItem");
  const toastEl       = document.getElementById("toast");

  /* =========================================================
     5. INIT
     ========================================================= */
  function init(){
    applyStoredTheme();
    buildEmojiGrid();
    buildGifGrid();
    loadHiddenMsgIds();

    sessionId = localStorage.getItem(LS_SESSION_KEY);
    if(!sessionId){
      sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(LS_SESSION_KEY, sessionId);
    }

    const savedUser = localStorage.getItem(LS_USER_KEY);
    if(savedUser){
      currentUser = savedUser;
      reclaimOrEnter(savedUser);
    }

    bindEvents();
  }

  function bindEvents(){
    loginForm.addEventListener("submit", onLogin);

    textInput.addEventListener("input", ()=>{
      sendBtn.disabled = textInput.value.trim().length === 0;
      textInput.style.height = "auto";
      textInput.style.height = Math.min(textInput.scrollHeight, 90) + "px";
      hideWarning();
    });
    textInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        if(!sendBtn.disabled) sendMessage();
      }
    });
    sendBtn.addEventListener("click", ()=> sendMessage());

    emojiBtn.addEventListener("click", ()=> togglePicker("emoji"));
    gifBtn.addEventListener("click", ()=> togglePicker("gif"));
    tabEmoji.addEventListener("click", ()=> switchPickerTab("emoji"));
    tabGif.addEventListener("click", ()=> switchPickerTab("gif"));

    cancelReplyBtn.addEventListener("click", clearReplyState);

    menuBtn.addEventListener("click", (e)=>{
      e.stopPropagation();
      settingsMenu.classList.toggle("open");
    });
    document.addEventListener("click", (e)=>{
      if(!settingsMenu.contains(e.target) && e.target !== menuBtn){
        settingsMenu.classList.remove("open");
      }
      closeAllContextMenus(e.target);
    });
    logoutBtn.addEventListener("click", logout);
    themeToggleBtn.addEventListener("click", toggleTheme);
    themeMenuItem.addEventListener("click", ()=>{ toggleTheme(); settingsMenu.classList.remove("open"); });

    window.addEventListener("beforeunload", ()=>{
      if(currentUser) usersRef.child(currentUser).remove();
    });
  }

  /* =========================================================
     6. LOGIN / USERNAME UNIQUENESS / SESSION
     ========================================================= */
  function setLoginBusy(isBusy){
    loginBtn.disabled = isBusy;
    loginBtnText.style.opacity = isBusy ? "0.6" : "1";
    loginSpinner.classList.toggle("show", isBusy);
  }
  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add("show");
    usernameInput.classList.add("error");
  }
  function clearLoginError(){
    loginError.classList.remove("show");
    usernameInput.classList.remove("error");
  }

  function onLogin(e){
    e.preventDefault();
    clearLoginError();
    const name = usernameInput.value.trim();
    if(!name) return;

    if(containsProfanity(name)){
      showLoginError("That username isn't allowed. Please choose another.");
      return;
    }
    if(name.length < 2){
      showLoginError("Username must be at least 2 characters.");
      return;
    }

    setLoginBusy(true);
    usersRef.child(name).once("value").then(snap=>{
      const existing = snap.val();
      const isFree = !existing || existing.sessionId === sessionId;
      if(!isFree){
        setLoginBusy(false);
        showLoginError("That username is already taken. Try another.");
        return;
      }
      currentUser = name;
      localStorage.setItem(LS_USER_KEY, name);
      claimUsername(name).then(()=>{
        setLoginBusy(false);
        enterChat();
      });
    }).catch(()=>{
      setLoginBusy(false);
      showLoginError("Couldn't reach the server. Check your Firebase config and try again.");
    });
  }

  function reclaimOrEnter(name){
    // Auto re-login for a returning session: reclaim the same username using the stored sessionId.
    usersRef.child(name).once("value").then(snap=>{
      const existing = snap.val();
      if(existing && existing.sessionId !== sessionId){
        // Someone else grabbed this name while we were away — fall back to login screen.
        localStorage.removeItem(LS_USER_KEY);
        currentUser = null;
        return;
      }
      claimUsername(name).then(enterChat);
    }).catch(()=>{
      // If we can't reach Firebase yet, still show the chat shell; listeners will retry.
      claimUsername(name).then(enterChat);
    });
  }

  function claimUsername(name){
    const userRef = usersRef.child(name);
    userRef.onDisconnect().remove();
    return userRef.set({ sessionId: sessionId, online: true, lastSeen: Date.now() });
  }

  function enterChat(){
    loginScreen.style.display = "none";
    chatScreen.style.display = "flex";
    myName.textContent = currentUser;
    myAvatar.textContent = currentUser.charAt(0).toUpperCase();
    listenForMessages();
  }

  function logout(){
    if(currentUser){
      usersRef.child(currentUser).onDisconnect().cancel();
      usersRef.child(currentUser).remove();
    }
    localStorage.removeItem(LS_USER_KEY);
    currentUser = null;
    messagesRef.off();
    messagesCache = {};
    messagesEl.innerHTML = "";
    chatScreen.style.display = "none";
    loginScreen.style.display = "flex";
    usernameInput.value = "";
    clearLoginError();
    settingsMenu.classList.remove("open");
  }

  /* =========================================================
     7. THEME
     ========================================================= */
  function applyStoredTheme(){
    const saved = localStorage.getItem(LS_THEME_KEY) || "dark";
    setTheme(saved);
  }
  function setTheme(theme){
    document.documentElement.setAttribute("data-theme", theme === "accent" ? "accent" : "dark");
    localStorage.setItem(LS_THEME_KEY, theme);
    themeToggleBtn.innerHTML = theme === "accent"
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  }
  function toggleTheme(){
    const current = document.documentElement.getAttribute("data-theme") === "accent" ? "accent" : "dark";
    setTheme(current === "accent" ? "dark" : "accent");
  }

  /* =========================================================
     8. HIDDEN MESSAGES ("delete for me" — local only)
     ========================================================= */
  function loadHiddenMsgIds(){
    try{
      const raw = localStorage.getItem(LS_HIDDEN_KEY);
      hiddenMsgIds = new Set(raw ? JSON.parse(raw) : []);
    }catch(e){ hiddenMsgIds = new Set(); }
  }
  function persistHiddenMsgIds(){
    localStorage.setItem(LS_HIDDEN_KEY, JSON.stringify([...hiddenMsgIds]));
  }
  function hideForMe(id){
    hiddenMsgIds.add(id);
    persistHiddenMsgIds();
    renderAll();
    showToast("Message hidden for you");
  }

  /* =========================================================
     9. FIREBASE LISTENERS
     ========================================================= */
  function listenForMessages(){
    messagesRef.off();
    messagesCache = {};

    messagesRef.on("child_added", (snap)=>{
      messagesCache[snap.key] = { id: snap.key, ...snap.val() };
      renderAll();
    });
    messagesRef.on("child_changed", (snap)=>{
      messagesCache[snap.key] = { id: snap.key, ...snap.val() };
      renderAll();
    });
    messagesRef.on("child_removed", (snap)=>{
      delete messagesCache[snap.key];
      renderAll();
    });
  }

  function sortedMessages(){
    return Object.values(messagesCache).sort((a,b)=> (a.timestamp||0) - (b.timestamp||0));
  }

  /* =========================================================
     10. SENDING
     ========================================================= */
  function sendMessage(customPayload){
    const text = customPayload && customPayload.text !== undefined ? customPayload.text : textInput.value.trim();
    const type = customPayload && customPayload.type ? customPayload.type : "text";
    const mediaUrl = customPayload && customPayload.mediaUrl ? customPayload.mediaUrl : null;

    if(type === "text" && !text) return;

    if(type === "text" && containsProfanity(text)){
      showWarning("That message isn't allowed. Please rephrase it.");
      return;
    }

    const payload = {
      sender: currentUser,
      type: type,
      text: type === "text" ? text : "",
      mediaUrl: mediaUrl,
      timestamp: Date.now(),
      reactions: {},
      seenBy: {},
      unsent: false,
      replyTo: replyingTo ? { id: replyingTo.id, sender: replyingTo.sender, preview: replyingTo.preview } : null
    };

    messagesRef.push(payload);

    textInput.value = "";
    textInput.style.height = "auto";
    sendBtn.disabled = true;
    clearReplyState();
    hideWarning();
    closePicker();
  }

  function showWarning(msg){
    warningText.textContent = msg;
    warningBar.classList.add("open");
  }
  function hideWarning(){
    warningBar.classList.remove("open");
  }

  /* =========================================================
     11. RENDERING
     ========================================================= */
  function renderAll(){
    const all = sortedMessages().filter(m => !hiddenMsgIds.has(m.id));
    messagesEl.innerHTML = "";

    if(all.length === 0){
      messagesEl.appendChild(emptyState);
      return;
    }

    let lastDay = null;
    all.forEach(msg=>{
      const day = new Date(msg.timestamp).toDateString();
      if(day !== lastDay){
        const divider = document.createElement("div");
        divider.className = "day-divider";
        divider.textContent = day === new Date().toDateString() ? "Today" : day;
        messagesEl.appendChild(divider);
        lastDay = day;
      }
      messagesEl.appendChild(renderMessage(msg));
      markSeenIfNeeded(msg);
    });

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function markSeenIfNeeded(msg){
    if(msg.unsent) return;
    if(msg.sender === currentUser) return;
    const seenBy = msg.seenBy || {};
    if(seenBy[currentUser]) return;
    db.ref(`messages/${msg.id}/seenBy/${currentUser}`).set(true);
  }

  function renderMessage(msg){
    const isMe = msg.sender === currentUser;
    const row = document.createElement("div");
    row.className = "msg-row " + (isMe ? "me" : "them");
    row.dataset.id = msg.id;

    if(!isMe){
      const senderEl = document.createElement("div");
      senderEl.className = "msg-sender";
      senderEl.textContent = msg.sender;
      row.appendChild(senderEl);
    }

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (msg.unsent ? " unsent" : "");

    if(msg.replyTo){
      const rp = document.createElement("div");
      rp.className = "reply-preview";
      rp.innerHTML = `<span class="rp-sender">${escapeHtml(msg.replyTo.sender)}</span><span class="rp-text">${escapeHtml(msg.replyTo.preview || "")}</span>`;
      rp.addEventListener("click", (e)=>{
        e.stopPropagation();
        const target = messagesEl.querySelector(`[data-id="${msg.replyTo.id}"]`);
        if(target){
          target.scrollIntoView({behavior:"smooth", block:"center"});
          target.style.filter = "brightness(1.4)";
          setTimeout(()=> target.style.filter = "", 600);
        }
      });
      bubble.appendChild(rp);
    }

    if(msg.unsent){
      bubble.appendChild(textNode("Message unsent"));
    }else if(msg.type === "gif" || msg.type === "image"){
      if(msg.text){
        bubble.appendChild(textNode(msg.text));
      }
      const img = document.createElement("img");
      img.src = msg.mediaUrl;
      img.className = "msg-media";
      img.alt = msg.type;
      bubble.appendChild(img);
    }else{
      bubble.appendChild(textNode(msg.text));
    }

    wrap.appendChild(bubble);

    if(!msg.unsent){
      wrap.appendChild(buildQuickBar(msg));
      wrap.appendChild(buildContextMenu(msg, isMe));

      wrap.addEventListener("mouseenter", ()=>{ wrap.classList.add("active"); });
      wrap.addEventListener("mouseleave", ()=>{ wrap.classList.remove("active"); });

      let pressTimer;
      bubble.addEventListener("touchstart", ()=>{
        pressTimer = setTimeout(()=>{ wrap.classList.add("active"); }, 350);
      });
      bubble.addEventListener("touchend", ()=> clearTimeout(pressTimer));
    }

    row.appendChild(wrap);

    if(!msg.unsent){
      const meta = document.createElement("div");
      meta.className = "msg-meta";
      meta.innerHTML = `<span class="msg-time">${formatTime(msg.timestamp)}</span>`;
      row.appendChild(meta);

      if(msg.reactions && Object.keys(msg.reactions).length){
        row.appendChild(buildReactionsRow(msg));
      }

      if(isMe){
        const seenNames = Object.keys(msg.seenBy || {}).filter(n => n !== currentUser);
        if(seenNames.length){
          const seenEl = document.createElement("div");
          seenEl.className = "seen-by";
          seenEl.textContent = "Seen by " + seenNames.join(", ");
          row.appendChild(seenEl);
        }
      }
    }

    return row;
  }

  function buildQuickBar(msg){
    const bar = document.createElement("div");
    bar.className = "quick-bar";
    QUICK_EMOJIS.forEach(emoji=>{
      const b = document.createElement("button");
      b.className = "quick-emoji";
      b.textContent = emoji;
      b.addEventListener("click", (e)=>{
        e.stopPropagation();
        toggleReaction(msg, emoji);
      });
      bar.appendChild(b);
    });
    const more = document.createElement("button");
    more.className = "quick-more";
    more.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>';
    more.addEventListener("click", (e)=>{
      e.stopPropagation();
      const ctx = e.currentTarget.closest(".bubble-wrap").querySelector(".msg-context");
      closeAllContextMenus();
      ctx.classList.add("open");
    });
    bar.appendChild(more);
    return bar;
  }

  function buildContextMenu(msg, isMe){
    const menu = document.createElement("div");
    menu.className = "msg-context";

    const replyItem = document.createElement("button");
    replyItem.className = "ctx-item";
    replyItem.textContent = "Reply";
    replyItem.addEventListener("click", (e)=>{
      e.stopPropagation();
      setReplyState(msg);
      closeAllContextMenus();
    });
    menu.appendChild(replyItem);

    const hideItem = document.createElement("button");
    hideItem.className = "ctx-item";
    hideItem.textContent = "Delete for me";
    hideItem.addEventListener("click", (e)=>{
      e.stopPropagation();
      hideForMe(msg.id);
      closeAllContextMenus();
    });
    menu.appendChild(hideItem);

    if(isMe){
      const withinUnsendWindow = (Date.now() - (msg.timestamp||0)) <= UNSEND_WINDOW_MS;
      if(withinUnsendWindow){
        const unsendItem = document.createElement("button");
        unsendItem.className = "ctx-item";
        unsendItem.textContent = "Unsend";
        unsendItem.addEventListener("click", (e)=>{
          e.stopPropagation();
          unsendMessage(msg.id);
          closeAllContextMenus();
        });
        menu.appendChild(unsendItem);
      }

      const deleteAllItem = document.createElement("button");
      deleteAllItem.className = "ctx-item danger";
      deleteAllItem.textContent = "Delete for everyone";
      deleteAllItem.addEventListener("click", (e)=>{
        e.stopPropagation();
        deleteForAll(msg.id);
        closeAllContextMenus();
      });
      menu.appendChild(deleteAllItem);
    }

    return menu;
  }

  function buildReactionsRow(msg){
    const row = document.createElement("div");
    row.className = "reactions-row";
    Object.entries(msg.reactions).forEach(([emoji, users])=>{
      const names = Object.keys(users || {});
      if(names.length === 0) return;
      const pill = document.createElement("div");
      pill.className = "reaction-pill" + (names.includes(currentUser) ? " mine" : "");
      pill.innerHTML = `<span>${emoji}</span><span>${names.length}</span>`;
      pill.addEventListener("click", ()=> toggleReaction(msg, emoji));
      row.appendChild(pill);
    });
    return row;
  }

  /* =========================================================
     12. MESSAGE ACTIONS (Firebase writes)
     ========================================================= */
  function toggleReaction(msg, emoji){
    const reactions = msg.reactions || {};
    const updates = {};

    Object.keys(reactions).forEach(e=>{
      if(reactions[e] && reactions[e][currentUser]){
        updates[`messages/${msg.id}/reactions/${e}/${currentUser}`] = null;
      }
    });

    const alreadyHadThis = reactions[emoji] && reactions[emoji][currentUser];
    if(!alreadyHadThis){
      updates[`messages/${msg.id}/reactions/${emoji}/${currentUser}`] = true;
    }

    db.ref().update(updates);
  }

  function unsendMessage(id){
    db.ref(`messages/${id}`).update({
      unsent: true,
      text: "",
      mediaUrl: null,
      reactions: {},
      seenBy: {},
      replyTo: null
    });
    showToast("Message unsent");
  }

  function deleteForAll(id){
    db.ref(`messages/${id}`).remove();
    showToast("Message deleted for everyone");
  }

  /* =========================================================
     13. REPLY STATE
     ========================================================= */
  function setReplyState(msg){
    let preview = msg.unsent ? "Message unsent" : (msg.type === "text" ? msg.text : (msg.type === "gif" ? "GIF" : "Image"));
    replyingTo = { id: msg.id, sender: msg.sender, preview: preview };
    replyingToName.textContent = msg.sender;
    replyingToText.textContent = preview;
    replyingBar.classList.add("open");
    textInput.focus();
  }
  function clearReplyState(){
    replyingTo = null;
    replyingBar.classList.remove("open");
  }

  /* =========================================================
     14. PICKERS
     ========================================================= */
  function togglePicker(tab){
    const isOpen = pickerPanel.classList.contains("open");
    const currentTab = tabEmoji.classList.contains("active") ? "emoji" : "gif";
    if(isOpen && currentTab === tab){
      closePicker();
    }else{
      pickerPanel.classList.add("open");
      switchPickerTab(tab);
    }
  }
  function closePicker(){ pickerPanel.classList.remove("open"); }
  function switchPickerTab(tab){
    tabEmoji.classList.toggle("active", tab === "emoji");
    tabGif.classList.toggle("active", tab === "gif");
    emojiGrid.classList.toggle("hidden", tab !== "emoji");
    gifGrid.classList.toggle("hidden", tab !== "gif");
  }
  function buildEmojiGrid(){
    emojiGrid.innerHTML = "";
    EMOJI_LIST.forEach(emoji=>{
      const b = document.createElement("button");
      b.className = "emoji-cell";
      b.textContent = emoji;
      b.addEventListener("click", ()=>{
        textInput.value += emoji;
        textInput.dispatchEvent(new Event("input"));
        textInput.focus();
      });
      emojiGrid.appendChild(b);
    });
  }
  function buildGifGrid(){
    gifGrid.innerHTML = "";
    presetGIFs.forEach(url=>{
      const cell = document.createElement("div");
      cell.className = "gif-cell";
      const img = document.createElement("img");
      img.src = url;
      img.loading = "lazy";
      cell.appendChild(img);
      cell.addEventListener("click", ()=>{
        sendMessage({ type:"gif", mediaUrl: url, text:"" });
      });
      gifGrid.appendChild(cell);
    });
  }

  /* =========================================================
     15. HELPERS
     ========================================================= */
  function closeAllContextMenus(exceptTarget){
    document.querySelectorAll(".msg-context.open").forEach(m=>{
      if(!exceptTarget || !m.contains(exceptTarget)) m.classList.remove("open");
    });
    if(!exceptTarget){
      document.querySelectorAll(".bubble-wrap.active").forEach(w=> w.classList.remove("active"));
    }
  }
  function formatTime(ts){
    const d = new Date(ts || Date.now());
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return `${h}:${m.toString().padStart(2,"0")} ${ampm}`;
  }
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
  function textNode(str){
    const p = document.createElement("p");
    p.className = "msg-text";
    p.textContent = str;
    return p;
  }
  let toastTimer;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove("show"), 2200);
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
