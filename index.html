<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidetalkk — Simple & Clean Live Chat</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --msg-sent: #6366f1;
      --msg-sent-text: #ffffff;
      --msg-received: #f1f5f9;
      --msg-received-text: #0f172a;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* Floating Chat Shell */
    .chat-app {
      width: 100%;
      max-width: 650px;
      height: 85vh;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    /* Header */
    .chat-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .user-tag input {
      border: none;
      background: #f1f5f9;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      width: 110px;
    }

    /* Messages Display */
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-info {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      padding: 0 0.2rem;
    }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.sent .message-bubble {
      background-color: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background-color: var(--msg-received);
      color: var(--msg-received-text);
      border-bottom-left-radius: 4px;
    }

    .message-bubble img.gif-img {
      max-width: 200px;
      border-radius: 12px;
      display: block;
      margin-top: 0.3rem;
    }

    /* Toolbar for Emojis & GIFs */
    .quick-toolbar {
      padding: 0.4rem 1rem;
      display: flex;
      gap: 0.5rem;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      align-items: center;
    }

    .tool-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .tool-btn:hover {
      background: #e2e8f0;
    }

    /* Input Controls */
    .input-area {
      padding: 0.8rem 1rem 1rem 1rem;
      display: flex;
      gap: 0.6rem;
      background: #f8fafc;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      outline: none;
      font-size: 0.95rem;
      transition: border 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal for GIF Selection */
    .gif-modal {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 1rem;
      right: 1rem;
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      padding: 1rem;
      z-index: 100;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 0.5rem;
    }

    .gif-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .gif-grid img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand-title">Sidetalkk</div>
      <div class="user-tag">
        <span>You:</span>
        <input type="text" id="usernameInput" value="Alex" maxlength="12" />
      </div>
    </header>

    <!-- Message Area -->
    <div id="messagesContainer" class="messages-container"></div>

    <!-- Quick Tool Bar (Emoji & GIF toggle) -->
    <div class="quick-toolbar">
      <button class="tool-btn" data-emoji="😊">😊</button>
      <button class="tool-btn" data-emoji="😂">😂</button>
      <button class="tool-btn" data-emoji="🔥">🔥</button>
      <button class="tool-btn" data-emoji="👍">👍</button>
      <button class="tool-btn" data-emoji="❤️">❤️</button>
      <button id="gifToggleBtn" class="tool-btn" style="font-size:0.85rem; font-weight:bold; background:#e0e7ff; color:#4f46e5;">GIF</button>
    </div>

    <!-- GIF Selection Popup -->
    <div id="gifModal" class="gif-modal">
      <div style="font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:0.4rem;">Select a GIF</div>
      <div class="gif-grid" id="gifGrid"></div>
    </div>

    <!-- Bottom Input -->
    <footer class="input-area">
      <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn" class="send-btn">Send</button>
    </footer>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1jajfkcVOL3vQfubhW5FFKWvAb3TkEck",
      authDomain: "sidetalkk.firebaseapp.com",
      projectId: "sidetalkk",
      storageBucket: "sidetalkk.firebasestorage.app",
      messagingSenderId: "585493665739",
      appId: "1:585493665739:web:e4b00ea7117e71fcb2084e",
      measurementId: "G-6SYMK7PYGY",
      databaseURL: "https://sidetalkk-default-rtdb.firebaseio.com" // Standard RTDB URL
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    // Preset GIFs
    const presetGIFs = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3A5MHFvZzN2ZjB1dDJzbHN4ZmprZjBiaThseXlyM3Y1bWV0dDNwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Cmr1OMJ2FN0B2/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2F3OWEydmtzcWwxeHdyOHBrcmRxbTJ4d3Rwc2Q1eWZpbnFid2dpZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l3q2K5jinAlChoCLS/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOThmZWExOWp2b2kxaHFzc3A4NnJqZXdtbWpqcTF4cnYyazBycjU3eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xT0xezQGU5xCDJuCPe/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcm5md2tjdXB0czIwbXdpb3ZrcXJscTVtbnNiaXZhbjJtdTJyNDR1MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKsjLuLXS26CD6w/giphy.gif"
    ];

    const state = {
      user: localStorage.getItem('sidetalkk_user') || 'Alex',
      messages: []
    };

    const elements = {
      usernameInput: document.getElementById('usernameInput'),
      messagesContainer: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      gifToggleBtn: document.getElementById('gifToggleBtn'),
      gifModal: document.getElementById('gifModal'),
      gifGrid: document.getElementById('gifGrid')
    };

    document.addEventListener('DOMContentLoaded', () => {
      elements.usernameInput.value = state.user;
      setupListeners();
      loadGIFs();
      listenForFirebaseMessages();
    });

    function setupListeners() {
      // Send message
      elements.sendBtn.addEventListener('click', () => sendTextMessage());

      // Enter Key
      elements.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendTextMessage();
        }
      });

      // User name edit
      elements.usernameInput.addEventListener('change', (e) => {
        state.user = e.target.value.trim() || 'Alex';
        localStorage.setItem('sidetalkk_user', state.user);
      });

      // Quick Emojis
      document.querySelectorAll('.tool-btn[data-emoji]').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.dataset.emoji;
          elements.messageInput.focus();
        });
      });

      // Toggle GIF modal
      elements.gifToggleBtn.addEventListener('click', () => {
        const isVisible = elements.gifModal.style.display === 'block';
        elements.gifModal.style.display = isVisible ? 'none' : 'block';
      });
    }

    function loadGIFs() {
      elements.gifGrid.innerHTML = '';
      presetGIFs.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.addEventListener('click', () => {
          sendGIFMessage(url);
          elements.gifModal.style.display = 'none';
        });
        elements.gifGrid.appendChild(img);
      });
    }

    function sendTextMessage() {
      const text = elements.messageInput.value.trim();
      if (!text) return;

      pushMessageToFirebase({ text: text, type: 'text' });
      elements.messageInput.value = '';
    }

    function sendGIFMessage(url) {
      pushMessageToFirebase({ url: url, type: 'gif' });
    }

    // Push live message to Firebase Realtime Database
    function pushMessageToFirebase(payload) {
      const msg = {
        sender: state.user,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now(),
        ...payload
      };

      push(messagesRef, msg);
    }

    // Listen for incoming live Firebase messages
    function listenForFirebaseMessages() {
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        state.messages = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            state.messages.push(data[key]);
          });
          // Sort by time created
          state.messages.sort((a, b) => a.createdAt - b.createdAt);
        }
        
        renderMessages();
      });
    }

    function renderMessages() {
      elements.messagesContainer.innerHTML = '';

      state.messages.forEach(msg => {
        const isMe = msg.sender === state.user;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;

        let contentHTML = '';
        if (msg.type === 'gif') {
          contentHTML = `<img src="${msg.url}" class="gif-img" alt="GIF" />`;
        } else {
          contentHTML = escapeHTML(msg.text);
        }

        msgDiv.innerHTML = `
          <div class="message-info">${msg.sender} • ${msg.timestamp}</div>
          <div class="message-bubble">${contentHTML}</div>
        `;

        elements.messagesContainer.appendChild(msgDiv);
      });

      elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
