<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SideTalk — Simple & Clean Live Chat</title>
  <style>
    :root {
      /* Light Mode Variables */
      --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --msg-sent: #6366f1;
      --msg-sent-text: #ffffff;
      --msg-received: #f1f5f9;
      --msg-received-text: #0f172a;
      --border: #e2e8f0;
      --header-bg: rgba(255, 255, 255, 0.9);
      --toolbar-bg: #f8fafc;
      --input-bg: #ffffff;
    }

    /* Dark Mode Variables */
    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-received: #334155;
      --msg-received-text: #f8fafc;
      --border: #334155;
      --header-bg: rgba(30, 41, 59, 0.9);
      --toolbar-bg: #0f172a;
      --input-bg: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      transition: background 0.3s ease;
    }

    /* Floating Chat Shell */
    .chat-app {
      width: 100%;
      max-width: 650px;
      height: 85vh;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.3s ease, border 0.3s ease;
    }

    /* Header */
    .chat-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      transition: background 0.3s ease, border 0.3s ease;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .user-tag input {
      border: none;
      background: var(--msg-received);
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      width: 110px;
    }

    /* Messages Display */
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-info {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      padding: 0 0.2rem;
    }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      cursor: pointer;
    }

    .message.sent .message-bubble {
      background-color: var(--msg-sent);
      color: var(--msg-sent-text);
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background-color: var(--msg-received);
      color: var(--msg-received-text);
      border-bottom-left-radius: 4px;
    }

    .message-bubble img.gif-img {
      max-width: 200px;
      border-radius: 12px;
      display: block;
      margin-top: 0.3rem;
    }

    .seen-status {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      padding: 0 0.4rem;
      font-style: italic;
    }

    /* Toolbar for Emojis & GIFs */
    .quick-toolbar {
      padding: 0.4rem 1rem;
      display: flex;
      gap: 0.3rem;
      background: var(--toolbar-bg);
      border-top: 1px solid var(--border);
      align-items: center;
      transition: background 0.3s ease;
      overflow-x: auto;
      white-space: nowrap;
    }
    
    /* Hide scrollbar for cleaner look */
    .quick-toolbar::-webkit-scrollbar {
      display: none;
    }

    .tool-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: background 0.2s;
      color: var(--text-main);
    }

    .tool-btn:hover {
      background: var(--msg-received);
    }

    /* Input Controls */
    .input-area {
      padding: 0.8rem 1rem 1rem 1rem;
      display: flex;
      gap: 0.6rem;
      background: var(--toolbar-bg);
      transition: background 0.3s ease;
    }

    .chat-input {
      flex: 1;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      outline: none;
      font-size: 0.95rem;
      transition: border 0.2s, background 0.3s ease, color 0.3s ease;
    }

    .chat-input:focus {
      border-color: var(--accent);
    }

    .send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal for GIF Selection */
    .gif-modal {
      display: none;
      position: absolute;
      bottom: 70px;
      left: 1rem;
      right: 1rem;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 1rem;
      z-index: 100;
    }

    .gif-custom-link {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .gif-custom-link input {
      padding: 0.5rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .gif-custom-link button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-height: 250px;
      overflow-y: auto;
    }

    .gif-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .gif-grid img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="brand-title">SideTalk</div>
      <div class="header-actions">
        <div class="user-tag">
          <span>You:</span>
          <input type="text" id="usernameInput" value="Alex" maxlength="12" />
        </div>
        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="tool-btn" title="Toggle Theme">🌓</button>
      </div>
    </header>

    <!-- Message Area -->
    <div id="messagesContainer" class="messages-container"></div>

    <!-- Quick Tool Bar with Expanded Emojis -->
    <div class="quick-toolbar">
      <button class="tool-btn" data-emoji="😊">😊</button>
      <button class="tool-btn" data-emoji="😂">😂</button>
      <button class="tool-btn" data-emoji="😭">😭</button>
      <button class="tool-btn" data-emoji="💀">💀</button>
      <button class="tool-btn" data-emoji="🔥">🔥</button>
      <button class="tool-btn" data-emoji="👍">👍</button>
      <button class="tool-btn" data-emoji="❤️">❤️</button>
      <button class="tool-btn" data-emoji="✨">✨</button>
      <button class="tool-btn" data-emoji="👀">👀</button>
      <button class="tool-btn" data-emoji="🎉">🎉</button>
      <button class="tool-btn" data-emoji="🤔">🤔</button>
      <button class="tool-btn" data-emoji="😅">😅</button>
      <button class="tool-btn" data-emoji="💯">💯</button>
      <button id="gifToggleBtn" class="tool-btn" style="font-size:0.85rem; font-weight:bold; background:var(--accent); color:white; padding:0.3rem 0.6rem; margin-left: auto;">GIF</button>
    </div>

    <!-- GIF Selection Popup -->
    <div id="gifModal" class="gif-modal">
      <div style="font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:0.4rem;">Paste an Image/GIF Link or Pick Below</div>
      
      <!-- Custom GIF Link Input -->
      <div class="gif-custom-link">
        <input type="text" id="gifLinkInput" class="chat-input" placeholder="Paste image/GIF URL..." autocomplete="off">
        <button id="sendGifLinkBtn" class="send-btn">Send</button>
      </div>

      <div class="gif-grid" id="gifGrid"></div>
    </div>

    <!-- Bottom Input -->
    <footer class="input-area">
      <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." autocomplete="off" />
      <button id="sendBtn" class="send-btn">Send</button>
    </footer>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    // Firebase configuration (Left completely untouched so your backend keeps working)
    const firebaseConfig = {
      apiKey: "AIzaSyC1jajfkcVOL3vQfubhW5FFKWvAb3TkEck",
      authDomain: "sidetalkk.firebaseapp.com",
      projectId: "sidetalkk",
      storageBucket: "sidetalkk.firebasestorage.app",
      messagingSenderId: "585493665739",
      appId: "1:585493665739:web:e4b00ea7117e71fcb2084e",
      measurementId: "G-6SYMK7PYGY",
      databaseURL: "https://sidetalkk-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    // Expanded Preset GIFs Library
    const presetGIFs = [
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3A5MHFvZzN2ZjB1dDJzbHN4ZmprZjBiaThseXlyM3Y1bWV0dDNwayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Cmr1OMJ2FN0B2/giphy.gif",
      "https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif",
      "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif",
      "https://media.giphy.com/media/3o7TKsjLuLXS26CD6w/giphy.gif",
      "https://media.giphy.com/media/26n6WywJyh39n1pBu/giphy.gif",
      "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif",
      "https://media.giphy.com/media/YRtLgsajXrz1FNJ6oy/giphy.gif",
      "https://media.giphy.com/media/3o6Zt4HU9uwXmXSAuI/giphy.gif",
      "https://media.giphy.com/media/L0qTl8hl84EDly62J1/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/B0vFTrb0ZGDf2/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/fDO2Nm0RDUtXhsycr8/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnJ2bTFnOThxNjEydGZ6NjFxdnh6YzY2aXBseTN2aGJrcnp3cnhpMSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/111ebonMs90YLu/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGxzbnVwMWd2NjhpZmxhYXR1dHA3bWFocG81bXZtbHFtbWFrcnhlYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/5VKbvrjvwVcj6/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZGI3cW1yd3Roc3V4cnYydzBwMDIxeG1nczB0cm0zbHB4YzByZjZqdiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/4ilFRqgbzbx4c/giphy.gif",
      "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHBpY2psZmhhZGxrbTVsc2FtdjN6ODltaGtkYng1aHFvYTh4cHVtYyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o7aD2saalEvTehRO0/giphy.gif"
    ];

    const state = {
      user: localStorage.getItem('sidetalk_user') || 'User_' + Math.floor(Math.random() * 100),
      theme: localStorage.getItem('sidetalk_theme') || 'light',
      messages: []
    };

    const elements = {
      usernameInput: document.getElementById('usernameInput'),
      messagesContainer: document.getElementById('messagesContainer'),
      messageInput: document.getElementById('messageInput'),
      sendBtn: document.getElementById('sendBtn'),
      gifToggleBtn: document.getElementById('gifToggleBtn'),
      gifModal: document.getElementById('gifModal'),
      gifGrid: document.getElementById('gifGrid'),
      gifLinkInput: document.getElementById('gifLinkInput'),
      sendGifLinkBtn: document.getElementById('sendGifLinkBtn'),
      themeToggleBtn: document.getElementById('themeToggleBtn')
    };

    document.addEventListener('DOMContentLoaded', () => {
      elements.usernameInput.value = state.user;
      
      // Apply saved theme on load
      document.body.setAttribute('data-theme', state.theme);

      setupListeners();
      loadGIFs();
      listenForFirebaseMessages();
    });

    function setupListeners() {
      // Theme Toggle Logic
      elements.themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('sidetalk_theme', newTheme);
      });

      // Send Text Message
      elements.sendBtn.addEventListener('click', () => sendTextMessage());
      elements.messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendTextMessage();
        }
      });

      // User name changes
      elements.usernameInput.addEventListener('change', (e) => {
        state.user = e.target.value.trim() || 'User_' + Math.floor(Math.random() * 100);
        localStorage.setItem('sidetalk_user', state.user);
      });

      // Quick Emoji insertion
      document.querySelectorAll('.tool-btn[data-emoji]').forEach(btn => {
        btn.addEventListener('click', () => {
          elements.messageInput.value += btn.dataset.emoji;
          elements.messageInput.focus();
        });
      });

      // Toggle GIF Menu
      elements.gifToggleBtn.addEventListener('click', () => {
        const isVisible = elements.gifModal.style.display === 'block';
        elements.gifModal.style.display = isVisible ? 'none' : 'block';
      });

      // Send Custom GIF Link
      elements.sendGifLinkBtn.addEventListener('click', () => {
        const url = elements.gifLinkInput.value.trim();
        if (url) {
          sendGIFMessage(url);
          elements.gifLinkInput.value = '';
          elements.gifModal.style.display = 'none';
        }
      });
    }

    function loadGIFs() {
      elements.gifGrid.innerHTML = '';
      presetGIFs.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.addEventListener('click', () => {
          sendGIFMessage(url);
          elements.gifModal.style.display = 'none';
        });
        elements.gifGrid.appendChild(img);
      });
    }

    function sendTextMessage() {
      const text = elements.messageInput.value.trim();
      if (!text) return;

      pushMessageToFirebase({ text: text, type: 'text' });
      elements.messageInput.value = '';
    }

    function sendGIFMessage(url) {
      pushMessageToFirebase({ url: url, type: 'gif' });
    }

    function pushMessageToFirebase(payload) {
      const msg = {
        sender: state.user,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now(),
        seenBy: [state.user],
        ...payload
      };

      push(messagesRef, msg).catch((error) => {
        alert("Failed to send! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function listenForFirebaseMessages() {
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        state.messages = [];
        
        if (data) {
          Object.keys(data).forEach(key => {
            const msgObj = { id: key, ...data[key] };
            state.messages.push(msgObj);
            
            // Handle Seen Status
            const seenList = msgObj.seenBy || [];
            if (!seenList.includes(state.user)) {
              markMessageAsSeen(key, seenList);
            }
          });

          state.messages.sort((a, b) => a.createdAt - b.createdAt);
        }
        
        renderMessages();
      }, (error) => {
        alert("Failed to load messages! Firebase Error: " + error.message);
        console.error(error);
      });
    }

    function markMessageAsSeen(msgId, currentSeenList) {
      const updatedSeen = [...currentSeenList, state.user];
      const msgDbRef = ref(db, `messages/${msgId}`);
      update(msgDbRef, { seenBy: updatedSeen });
    }

    function renderMessages() {
      elements.messagesContainer.innerHTML = '';

      state.messages.forEach(msg => {
        const isMe = msg.sender === state.user;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isMe ? 'sent' : 'received'}`;

        let contentHTML = '';
        if (msg.type === 'gif') {
          contentHTML = `<img src="${msg.url}" class="gif-img" alt="GIF/Image" />`;
        } else {
          contentHTML = escapeHTML(msg.text);
        }

        const seenList = msg.seenBy || [];
        const seenByOthers = seenList.filter(u => u !== msg.sender);
        
        let seenHTML = '';
        if (isMe && seenByOthers.length > 0) {
          seenHTML = `<div class="seen-status">Seen by ${seenByOthers.join(', ')}</div>`;
        }

        msgDiv.innerHTML = `
          <div class="message-info">${msg.sender} • ${msg.timestamp}</div>
          <div class="message-bubble" title="Double-click to copy message">${contentHTML}</div>
          ${seenHTML}
        `;

        // Add double-click to copy functionality for text messages
        if (msg.type === 'text') {
          const bubble = msgDiv.querySelector('.message-bubble');
          bubble.addEventListener('dblclick', () => {
            navigator.clipboard.writeText(msg.text).then(() => {
              // Quick visual feedback
              const originalColor = bubble.style.backgroundColor;
              bubble.style.backgroundColor = '#10b981'; // Green flash
              setTimeout(() => bubble.style.backgroundColor = originalColor, 300);
            });
          });
        }

        elements.messagesContainer.appendChild(msgDiv);
      });

      elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
