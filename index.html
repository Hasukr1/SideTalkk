<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SideTalkk</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.75);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --sent: #4f46e5;
      --recv: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background: radial-gradient(circle at top left, #1e1b4b, #0b0f19 60%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
    }

    /* Main Chat UI */
    .chat-card {
      width: 100%;
      max-width: 800px;
      height: 88vh;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .header {
      padding: 16px 24px;
      background: rgba(11, 15, 25, 0.5);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .status-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }

    .messages-container {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg-group {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-group.sent { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }

    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .sent .msg-body { align-items: flex-end; }

    .msg-meta { font-size: 0.75rem; color: var(--subtext); display: flex; gap: 8px; }

    .reply-preview-bubble {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      color: var(--subtext);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .received .bubble { background: var(--recv); border-top-left-radius: 2px; border: 1px solid var(--border); }
    .sent .bubble { background: var(--sent); border-top-right-radius: 2px; color: #fff; }

    .reply-btn {
      font-size: 0.7rem;
      color: var(--subtext);
      cursor: pointer;
      margin-top: 2px;
    }
    .reply-btn:hover { color: var(--text); }

    .active-reply-bar {
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      font-size: 0.85rem;
      color: var(--subtext);
      display: none;
      justify-content: space-between;
      align-items: center;
    }
    .active-reply-bar button { background: none; border: none; color: #ef4444; cursor: pointer; }

    .footer {
      padding: 16px 24px;
      background: rgba(11, 15, 25, 0.5);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      position: relative;
    }

    .chat-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      outline: none;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }

    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0 8px;
    }

    .emoji-picker {
      position: absolute;
      bottom: 80px;
      right: 24px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .emoji-picker span {
      font-size: 1.4rem;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s;
    }
    .emoji-picker span:hover { transform: scale(1.2); }
  </style>
</head>
<body>

  <!-- CHAT UI -->
  <div class="chat-card">
    <div class="header">
      <div class="brand">
        <div class="status-dot"></div>
        <h2>SideTalkk</h2>
      </div>
      <div>
        <span style="font-size: 0.85rem; color: var(--subtext);">Logged as: </span>
        <strong id="currentUserName">Guest</strong>
        <button onclick="changeUsername()" style="background: none; border: none; color: var(--accent); margin-left: 8px; cursor: pointer; text-decoration: underline;">Change</button>
      </div>
    </div>

    <div class="messages-container" id="chatBox"></div>

    <div class="active-reply-bar" id="replyBar">
      <span id="replyText">Replying to...</span>
      <button onclick="cancelReply()">✕</button>
    </div>

    <div class="emoji-picker" id="emojiPicker">
      <span>😀</span><span>😂</span><span>🔥</span><span>❤️</span><span>👍</span>
      <span>😎</span><span>💀</span><span>🎉</span><span>😭</span><span>✨</span>
    </div>

    <form class="footer" id="chatForm">
      <button type="button" class="emoji-btn" id="emojiToggle">😊</button>
      <input type="text" id="msgInput" class="chat-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="btn">Send</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://tuaqfedssagapneldepn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_crXYWwNe4TRDJKxEM7Cuvw_cJS-20Vz";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-assign or load existing guest username
    let currentUser = localStorage.getItem('st_user') || 'User_' + Math.floor(1000 + Math.random() * 9000);
    localStorage.setItem('st_user', currentUser);
    document.getElementById('currentUserName').innerText = currentUser;

    let selectedReply = null;

    loadHistory();
    listenRealtime();

    function changeUsername() {
      const newName = prompt("Enter a display name:", currentUser);
      if (newName && newName.trim() !== '') {
        currentUser = newName.trim();
        localStorage.setItem('st_user', currentUser);
        document.getElementById('currentUserName').innerText = currentUser;
      }
    }

    // EMOJI TOGGLE
    const emojiPicker = document.getElementById('emojiPicker');
    document.getElementById('emojiToggle').onclick = () => {
      emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
    };

    document.querySelectorAll('.emoji-picker span').forEach(el => {
      el.onclick = () => {
        document.getElementById('msgInput').value += el.innerText;
        emojiPicker.style.display = 'none';
      };
    });

    // REPLY SYSTEM
    function startReply(user, text) {
      selectedReply = { user, text };
      document.getElementById('replyBar').style.display = 'flex';
      document.getElementById('replyText').innerText = `Replying to ${user}: "${text.substring(0, 25)}..."`;
    }

    function cancelReply() {
      selectedReply = null;
      document.getElementById('replyBar').style.display = 'none';
    }

    // SEND MESSAGE
    document.getElementById('chatForm').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        username: currentUser,
        text: text,
        reply_user: selectedReply ? selectedReply.user : null,
        reply_text: selectedReply ? selectedReply.text : null
      };

      input.value = '';
      cancelReply();

      await supabase.from('messages').insert([payload]);
    };

    // RENDER MESSAGE BUBBLE
    function renderMessage(msg) {
      const isMe = msg.username === currentUser;
      const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const replyHTML = msg.reply_user ? `<div class="reply-preview-bubble"><strong>${msg.reply_user}:</strong> ${msg.reply_text}</div>` : '';

      const msgHTML = `
        <div class="msg-group ${isMe ? 'sent' : 'received'}">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${msg.username}" class="msg-avatar">
          <div class="msg-body">
            <div class="msg-meta">
              <span>${msg.username}</span>
              <span>${timeStr}</span>
            </div>
            <div class="bubble">
              ${replyHTML}
              ${msg.text}
            </div>
            <div class="reply-btn" onclick="startReply('${msg.username}', '${msg.text.replace(/'/g, "\\'")}')">↩ Reply</div>
          </div>
        </div>
      `;

      const chatBox = document.getElementById('chatBox');
      chatBox.insertAdjacentHTML('beforeend', msgHTML);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // LOAD HISTORICAL MESSAGES
    async function loadHistory() {
      const { data: messages } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
      if (messages) {
        messages.forEach(renderMessage);
      }
    }

    // SUBSCRIBE TO REALTIME MESSAGES
    function listenRealtime() {
      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }
  </script>
</body>
</html>
